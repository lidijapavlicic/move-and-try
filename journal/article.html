<style>
.journal-article-page{background:#f7f6f2;color:#202420;}
.journal-article-page,.journal-article-page *{box-sizing:border-box;}
.journal-article-page .site-header{position:sticky;top:0;z-index:100;}
.header-behind-link{color:#555;font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;letter-spacing:.04em;text-decoration:none;white-space:nowrap;transition:opacity .2s ease;}
.header-behind-link:hover{opacity:.55;}

@media(min-width:769px){
.site-header{grid-template-columns:minmax(120px,1fr) auto minmax(120px,1fr);gap:16px;}
.desktop-nav{gap:clamp(12px,2vw,38px);}
.desktop-nav a{white-space:nowrap;}
}
@media(max-width:1250px) and (min-width:769px){
.header-behind-link{display:none;}
}
@media(max-width:768px){
.header-behind-link{display:none;}
}

.journal-article-back-wrap{width:100%;background:#f7f6f2;}
.journal-article-back{display:block;width:min(calc(100% - 48px),1100px);margin:0 auto;padding:30px 0;color:#17251e;font-family:'Manrope',sans-serif;font-size:11px;font-weight:800;letter-spacing:.09em;text-decoration:none;}
.journal-article-back:hover{text-decoration:underline;}

.journal-article-hero{width:min(calc(100% - 48px),1100px);margin:0 auto;padding:60px 0 70px;}
.journal-article-meta{margin:0 0 24px;color:#70736d;font-family:'Manrope',sans-serif;font-size:10px;font-weight:800;letter-spacing:.16em;line-height:1.6;text-transform:uppercase;}
.journal-article-title{max-width:900px;margin:0;color:#17251e;font-family:'DM Serif Display',serif;font-size:clamp(46px,7vw,88px);font-weight:400;line-height:.98;letter-spacing:-.035em;}
.journal-article-intro{max-width:760px;margin:34px 0 0;color:#444941;font-family:'Manrope',sans-serif;font-size:18px;line-height:1.8;}

.journal-article-image-wrap{width:100%;margin:0;padding:0;background:#1d241d;overflow:hidden;}
.journal-article-image{display:block;width:100%;height:min(66vw,760px);object-fit:cover;object-position:center;margin:0;padding:0;border:0;}

.journal-article-content{width:min(calc(100% - 48px),760px);margin:0 auto;padding:90px 0 100px;}
.journal-article-content p{margin:0 0 28px;color:#343832;font-family:'Manrope',sans-serif;font-size:17px;line-height:1.9;}
.journal-article-content strong{color:#17251e;font-weight:800;}
.journal-article-content h2{margin:70px 0 28px;color:#17251e;font-family:'DM Serif Display',serif;font-size:39px;font-weight:400;line-height:1.1;}
.journal-article-highlight{margin:55px 0!important;padding:38px 0;border-top:1px solid #cfd3ca;border-bottom:1px solid #cfd3ca;color:#17251e!important;font-family:'DM Serif Display',serif!important;font-size:30px!important;line-height:1.35!important;}

.journal-article-links{display:grid;gap:14px;margin:52px 0;}
.journal-article-link{display:flex;align-items:center;justify-content:space-between;gap:25px;padding:20px 22px;border:1px solid #17251e;color:#17251e;font-family:'Manrope',sans-serif;font-size:11px;font-weight:800;letter-spacing:.06em;line-height:1.5;text-decoration:none;transition:background .2s ease,color .2s ease;}
.journal-article-link:hover{background:#17251e;color:#fff;}

.journal-thank-you{margin-top:70px;padding:45px;background:#e8e9e2;}
.journal-thank-you-label{margin:0 0 15px!important;color:#74776f!important;font-size:10px!important;font-weight:800!important;letter-spacing:.16em!important;text-transform:uppercase;}
.journal-thank-you p:last-child{margin-bottom:0;}

.journal-article-signature{margin-top:80px;padding-top:35px;border-top:1px solid #cfd3ca;}
.journal-article-signature strong{display:block;color:#17251e;font-family:'Manrope',sans-serif;font-size:12px;font-weight:800;letter-spacing:.06em;}
.journal-article-signature span{display:block;margin-top:7px;color:#74776f;font-family:'Manrope',sans-serif;font-size:11px;letter-spacing:.03em;}

.journal-article-footer{padding:75px 24px;background:#17251e;text-align:center;}
.journal-article-footer p{margin:0 0 14px;color:#cfd6cb;font-family:'Manrope',sans-serif;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;}
.journal-article-footer h2{margin:0 0 30px;color:#fff;font-family:'DM Serif Display',serif;font-size:38px;font-weight:400;line-height:1.1;}
.journal-article-footer a{display:inline-flex;padding:14px 20px;border:1px solid rgba(255,255,255,.7);color:#fff;font-family:'Manrope',sans-serif;font-size:10px;font-weight:800;letter-spacing:.08em;text-decoration:none;transition:background .2s ease,color .2s ease;}
.journal-article-footer a:hover{background:#fff;color:#17251e;}

@media(max-width:768px){
.journal-article-back{width:calc(100% - 40px);padding:25px 0;}
.journal-article-hero{width:calc(100% - 40px);padding:45px 0 55px;}
.journal-article-title{font-size:clamp(43px,13vw,62px);}
.journal-article-intro{margin-top:25px;font-size:16px;}
.journal-article-image{height:68vh;max-height:650px;object-position:center;}
.journal-article-content{width:calc(100% - 40px);padding:65px 0 75px;}
.journal-article-content p{font-size:16px;line-height:1.85;}
.journal-article-content h2{margin-top:55px;font-size:33px;}
.journal-article-highlight{margin:45px 0!important;font-size:25px!important;}
.journal-thank-you{margin-top:55px;padding:30px 25px;}
.journal-article-link{align-items:flex-start;}
.journal-article-footer{padding:65px 20px;}
.journal-article-footer h2{font-size:32px;}
}

#journal-public-content figure{margin:35px 0;text-align:center}
#journal-public-content figure img{display:block;height:auto;margin:0 auto;object-fit:contain}
#journal-public-content figcaption{font:12px/1.65 Manrope,sans-serif;color:#6a6e67;margin-top:10px}
#journal-public-content ul,#journal-public-content ol{padding-left:24px;margin:20px 0 34px;font:16px/1.85 Manrope,sans-serif}
#journal-public-content h3{font:26px/1.3 "DM Serif Display",serif;margin:40px 0 16px}
#journal-public-content hr{border:0;border-top:1px solid #cbd0c6;margin:45px 0}
</style>
