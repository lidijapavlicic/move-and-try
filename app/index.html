<!doctype html>

<head>

<title>MOVE&TRY — App</title>


<style>
:root{--bg:#f7f6f2;--ink:#171916;--muted:#697067;--green:#1f2a18;--line:#dcded6;--white:#fff}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,sans-serif}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible{outline:3px solid #758b6b;outline-offset:3px}[hidden]{display:none!important}.shell{max-width:720px;margin:auto;min-height:100dvh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 22px 18px}.brand{font-weight:800;letter-spacing:.1em;font-size:18px}.language{border:1px solid var(--line);background:#fff;padding:8px 12px;font-size:11px;font-weight:800}.eyebrow{font-size:10px;letter-spacing:.18em;font-weight:800;color:#687b61;text-transform:uppercase}.intro{padding:30px 22px 18px}.intro h1{font-family:'DM Serif Display',serif;font-size:clamp(40px,10vw,62px);font-weight:400;line-height:1.05;margin:14px 0}.intro p{font-size:14px;line-height:1.8;color:var(--muted);max-width:440px}.hero{margin:12px 22px 28px;min-height:230px;position:relative;overflow:hidden;background:#243227 url('/images/home-discover.png') center/cover no-repeat}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(0,0,0,.55))}.hero span{position:absolute;z-index:1;left:20px;bottom:18px;color:white;font-size:11px;letter-spacing:.14em;font-weight:800}.section{padding:14px 22px 26px}.section h2{font-family:'DM Serif Display',serif;font-weight:400;font-size:31px;margin:8px 0 18px}.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.category{min-height:140px;padding:17px;display:flex;flex-direction:column;justify-content:flex-end;background-color:#243227;background-position:center;background-size:cover;position:relative;isolation:isolate;color:#fff;overflow:hidden}.category:before{content:'';position:absolute;z-index:-1;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.72))}.category strong{font-size:17px;letter-spacing:.05em}.category small{font-size:10px;opacity:.88;margin-top:7px}.feature{border-top:1px solid var(--line);padding:22px 0;display:flex;justify-content:space-between;align-items:center;gap:15px}.feature strong{display:block;font-size:13px}.feature small{display:block;color:var(--muted);font-size:11px;margin-top:5px}.feature span:last-child{font-size:20px}.bottom{position:fixed;z-index:5;bottom:0;left:0;right:0;background:rgba(247,246,242,.97);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:11px max(12px,env(safe-area-inset-right)) calc(11px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));backdrop-filter:blur(10px)}.bottom button{border:0;background:none;color:var(--muted);min-width:62px;display:grid;gap:4px;justify-items:center;font-size:10px;font-weight:700}.bottom button[aria-current="page"]{color:var(--green)}.bottom svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.placeholder{padding:40px 22px}.placeholder h1{font-family:'DM Serif Display',serif;font-size:44px;font-weight:400}.placeholder p{color:var(--muted);font-size:14px;line-height:1.8}.text-link{display:inline-block;border-bottom:1px solid var(--ink);font-size:12px;font-weight:800;padding:7px 0}.overlay{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;padding:26px}.welcome{max-width:390px;width:100%;text-align:center}.welcome .brand{font-size:26px}.welcome h1{font-family:'DM Serif Display',serif;font-size:39px;font-weight:400;margin:42px 0 10px}.welcome p{font-size:13px;color:var(--muted);line-height:1.7}.choices{display:grid;gap:12px;margin:30px 0 22px}.choice{background:white;border:1px solid var(--line);padding:18px;text-align:left;font-size:14px;font-weight:700}.choice[aria-pressed="true"]{border:2px solid var(--green);padding:17px}.primary{border:0;background:var(--green);color:white;padding:17px;width:100%;font-size:12px;font-weight:800;letter-spacing:.08em}.hint{font-size:11px!important;margin-top:18px}@media(min-width:720px){.bottom{left:50%;right:auto;transform:translateX(-50%);width:720px}.hero{min-height:310px}.category{min-height:190px}}
</style>
</head>
<body>
<div class="overlay" id="welcome" hidden><div class="welcome"><div class="brand">MOVE&TRY</div><h1>Choose your language.</h1><p>Odaberi jezik / Select your language</p><div class="choices"><button class="choice" type="button" data-choice="hr" aria-pressed="true">🇭🇷 Hrvatski</button><button class="choice" type="button" data-choice="en" aria-pressed="false">🇬🇧 English</button></div><button class="primary" id="continue" type="button">NASTAVI →</button><p class="hint">Jezik možeš promijeniti kasnije. / You can change it later.</p></div></div>
<div class="shell"><header class="top"><a class="brand" href="/app/" aria-label="MOVE&TRY home">MOVE&TRY</a><button class="language" id="language-toggle" type="button" aria-label="Change language">HR / EN</button></header><main id="view" tabindex="-1"></main></div>
<nav class="bottom" aria-label="App navigation"><button type="button" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3z"/><path d="M9 20v-7h6v7"/></svg><span data-nav="home">Početna</span></button><button type="button" data-tab="explore"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span data-nav="explore">Istraži</span></button><button type="button" data-tab="journal"><svg viewBox="0 0 24 24"><path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/><path d="M8 9h7M8 13h7"/></svg><span data-nav="journal">Journal</span></button><button type="button" data-tab="saved"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg><span data-nav="saved">Spremljeno</span></button></nav>
<script>
(()=>{'use strict';const KEY='moveandtry_app_language';const CATEGORIES=[['move','MOVE','category-move.webp'],['learn','LEARN','category-learn.webp'],['create','CREATE','category-create.webp'],['explore','EXPLORE','category-explore.webp'],['dare','DARE','category-dare.webp'],['care','CARE','category-care.webp']];const T={hr:{intro:'Tvoja sljedeća priča počinje znatiželjom.',sub:'Istraži aktivnosti, pročitaj stvarna iskustva i pronađi nešto novo što želiš isprobati.',discover:'OTKRIJ NEŠTO NOVO',categories:'Što ti se danas radi?',explore:'Istraži',home:'Početna',journal:'Journal',saved:'Spremljeno',latest:'ZA INSPIRACIJU',journalText:'Priče, ideje i iskustva.',journalLink:'Otvori The Journal',savedText:'Ovdje će se nalaziti tvoji spremljeni sadržaji. Funkcionalnost dodajemo u sljedećoj fazi.',exploreText:'Odaberi kategoriju i istraži aktivnosti na MOVE&TRY webu.',change:'Promijeni jezik',continue:'NASTAVI →',hint:'U pripremi je posebno iskustvo unutar aplikacije.'},en:{intro:'Your next story starts with curiosity.',sub:'Explore activities, read real experiences and find something new you want to try.',discover:'DISCOVER SOMETHING NEW',categories:'What do you feel like doing today?',explore:'Explore',home:'Home',journal:'Journal',saved:'Saved',latest:'FOR INSPIRATION',journalText:'Stories, ideas and experiences.',journalLink:'Open The Journal',savedText:'Your saved content will appear here. This feature is coming in a later phase.',exploreText:'Choose a category and discover activities on the MOVE&TRY website.',change:'Change language',continue:'CONTINUE →',hint:'A dedicated in-app experience is coming soon.'}};let lang=localStorage.getItem(KEY);if(lang!=='hr'&&lang!=='en')lang=null;let selected=lang||'hr';let tab='home';const view=document.getElementById('view');const welcome=document.getElementById('welcome');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const t=T[lang||selected];document.documentElement.lang=lang||selected;document.title='MOVE&TRY — '+t.home;document.querySelectorAll('[data-nav]').forEach(n=>n.textContent=t[n.dataset.nav]);document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));const prefix=(lang||selected)==='hr'?'/hr/':'/';const cards=CATEGORIES.map(([slug,name,img])=>`<a class="category" href="${prefix}${slug}.html" style="background-image:url('/images/${img}')"><strong>${name}</strong><small>${t.explore} →</small></a>`).join('');if(tab==='home'){view.innerHTML=`<section class="intro"><div class="eyebrow">MOVE&TRY · ${t.discover}</div><h1>${t.intro}</h1><p>${t.sub}</p></section><div class="hero"><span>YOU DON'T HAVE TO BE GOOD AT IT. JUST TRY.</span></div><section class="section"><div class="eyebrow">${t.discover}</div><h2>${t.categories}</h2><div class="categories">${cards}</div></section><section class="section"><div class="eyebrow">${t.latest}</div><h2>The Journal</h2><a class="feature" href="${prefix}journal.html"><span><strong>${t.journalText}</strong><small>${t.journalLink}</small></span><span>→</span></a></section>`;}else if(tab==='explore'){view.innerHTML=`<section class="placeholder"><div class="eyebrow">MOVE&TRY</div><h1>${t.explore}</h1><p>${t.exploreText}</p><div class="categories">${cards}</div></section>`;}else if(tab==='journal'){view.innerHTML=`<section class="placeholder"><div class="eyebrow">THE JOURNAL</div><h1>The Journal</h1><p>${t.journalText}</p><a class="text-link" href="${prefix}journal.html">${t.journalLink} →</a></section>`;}else{view.innerHTML=`<section class="placeholder"><div class="eyebrow">MOVE&TRY</div><h1>${t.saved}</h1><p>${t.savedText}</p></section>`;}}function showChoice(){selected=lang||selected;welcome.hidden=false;document.querySelectorAll('[data-choice]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.choice===selected)));document.getElementById('continue').textContent=T[selected].continue;}document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.choice;showChoice();}));document.getElementById('continue').addEventListener('click',()=>{lang=selected;localStorage.setItem(KEY,lang);welcome.hidden=true;render();});document.getElementById('language-toggle').addEventListener('click',showChoice);document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render();window.scrollTo(0,0);}));if(!lang)showChoice();render();if('serviceWorker'in navigator&&window.isSecureContext){window.addEventListener('load',()=>{navigator.serviceWorker.register('/app/sw.js',{scope:'/app/'}).catch(err=>console.warn('MOVE&TRY app service worker:',err));});}})();
</script>
</body>
</html>
