
<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="MOVE&TRY — Discover something new to try.">
  <meta name="robots" content="noindex, nofollow">

  <title>MOVE&TRY — App</title>

  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f7f6f2;
      --ink: #171916;
      --muted: #697067;
      --green: #1f2a18;
      --line: #dcded6;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #758b6b;
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    .shell {
      max-width: 720px;
      margin: 0 auto;
      min-height: 100dvh;
      padding-bottom: calc(95px + env(safe-area-inset-bottom));
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 22px 18px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .1em;
    }

    .language {
      padding: 8px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 11px;
      font-weight: 800;
    }

    .eyebrow {
      color: #687b61;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .intro {
      padding: 30px 22px 18px;
    }

    .intro h1 {
      margin: 14px 0;
      font-family: 'DM Serif Display', serif;
      font-size: clamp(40px, 10vw, 62px);
      font-weight: 400;
      line-height: 1.05;
    }

    .intro p {
      max-width: 440px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .hero {
      position: relative;
      overflow: hidden;
      min-height: 230px;
      margin: 12px 22px 28px;
      background: #243227 url('/images/home-discover.png') center/cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,.55));
    }

    .hero span {
      position: absolute;
      z-index: 1;
      bottom: 18px;
      left: 20px;
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
    }

    .section {
      padding: 14px 22px 26px;
    }

    .section h2 {
      margin: 8px 0 18px;
      font-family: 'DM Serif Display', serif;
      font-size: 31px;
      font-weight: 400;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .category {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      min-height: 140px;
      padding: 17px;
      background-color: #243227;
      background-position: center;
      background-size: cover;
      color: #fff;
    }

    .category::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.72));
    }

    .category strong {
      font-size: 17px;
      letter-spacing: .05em;
    }

    .category small {
      margin-top: 7px;
      font-size: 10px;
      opacity: .88;
    }

    .feature {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 22px 0;
      border-top: 1px solid var(--line);
    }

    .feature strong {
      display: block;
      font-size: 13px;
    }

    .feature small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
    }

    .feature > span:last-child {
      font-size: 20px;
    }

    .placeholder {
      padding: 40px 22px;
    }

    .placeholder h1 {
      font-family: 'DM Serif Display', serif;
      font-size: 44px;
      font-weight: 400;
    }

    .placeholder p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    .text-link {
      display: inline-block;
      padding: 7px 0;
      border-bottom: 1px solid var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    .bottom {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      justify-content: space-around;
      padding:
        11px max(12px, env(safe-area-inset-right))
        calc(11px + env(safe-area-inset-bottom))
        max(12px, env(safe-area-inset-left));
      border-top: 1px solid var(--line);
      background: rgba(247,246,242,.97);
      backdrop-filter: blur(10px);
    }

    .bottom button {
      display: grid;
      justify-items: center;
      gap: 4px;
      min-width: 62px;
      border: 0;
      background: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .bottom button[aria-current="page"] {
      color: var(--green);
    }

    .bottom svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .overlay {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 26px;
      background: var(--bg);
    }

    .welcome {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .welcome .brand {
      font-size: 26px;
    }

    .welcome h1 {
      margin: 42px 0 10px;
      font-family: 'DM Serif Display', serif;
      font-size: 39px;
      font-weight: 400;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .choices {
      display: grid;
      gap: 12px;
      margin: 30px 0 22px;
    }

    .choice {
      padding: 18px;
      border: 1px solid var(--line);
      background: #fff;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
    }

    .choice[aria-pressed="true"] {
      padding: 17px;
      border: 2px solid var(--green);
    }

    .primary {
      width: 100%;
      padding: 17px;
      border: 0;
      background: var(--green);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .hint {
      margin-top: 18px;
      font-size: 11px !important;
    }

    @media (min-width: 720px) {
      .bottom {
        right: auto;
        left: 50%;
        width: 720px;
        transform: translateX(-50%);
      }

      .hero {
        min-height: 310px;
      }

      .category {
        min-height: 190px;
      }
    }
  </style>
</head>

<body>

  <div class="overlay" id="welcome" hidden>
    <div class="welcome">
      <div class="brand">MOVE&TRY</div>

      <h1>Choose your language.</h1>

      <p>Odaberi jezik / Select your language</p>

      <div class="choices">
        <button
          class="choice"
          type="button"
          data-choice="hr"
          aria-pressed="true"
        >
          🇭🇷 Hrvatski
        </button>

        <button
          class="choice"
          type="button"
          data-choice="en"
          aria-pressed="false"
        >
          🇬🇧 English
        </button>
      </div>

      <button class="primary" id="continue" type="button">
        NASTAVI →
      </button>

      <p class="hint">
        Jezik možeš promijeniti kasnije. /
        You can change it later.
      </p>
    </div>
  </div>

  <div class="shell">

    <header class="top">
      <a class="brand" href="/app/" aria-label="MOVE&TRY home">
        MOVE&TRY
      </a>

      <button
        class="language"
        id="language-toggle"
        type="button"
        aria-label="Change language"
      >
        HR / EN
      </button>
    </header>

    <main id="view" tabindex="-1"></main>

  </div>

  <nav class="bottom" aria-label="App navigation">

    <button type="button" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v10H3z"/>
        <path d="M9 20v-7h6v7"/>
      </svg>
      <span data-nav="home">Početna</span>
    </button>

    <button type="button" data-tab="explore">
      <svg viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <path d="m16 16 5 5"/>
      </svg>
      <span data-nav="explore">Istraži</span>
    </button>

    <button type="button" data-tab="journal">
      <svg viewBox="0 0 24 24">
        <path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/>
        <path d="M8 9h7M8 13h7"/>
      </svg>
      <span data-nav="journal">Journal</span>
    </button>

    <button type="button" data-tab="saved">
      <svg viewBox="0 0 24 24">
        <path d="M6 3h12v18l-6-4-6 4z"/>
      </svg>
      <span data-nav="saved">Spremljeno</span>
    </button>

  </nav>

  <script>
    (() => {
      'use strict';

      const APP_LANGUAGE_KEY = 'moveandtry_app_language';
      const WEB_LANGUAGE_KEY = 'moveandtry_language';

      const CATEGORIES = [
        ['move', 'MOVE', 'category-move.webp'],
        ['learn', 'LEARN', 'category-learn.webp'],
        ['create', 'CREATE', 'category-create.webp'],
        ['explore', 'EXPLORE', 'category-explore.webp'],
        ['dare', 'DARE', 'category-dare.webp'],
        ['care', 'CARE', 'category-care.webp']
      ];

      const T = {
        hr: {
          intro: 'Tvoja sljedeća priča počinje znatiželjom.',
          sub: 'Istraži aktivnosti, pročitaj stvarna iskustva i pronađi nešto novo što želiš isprobati.',
          discover: 'OTKRIJ NEŠTO NOVO',
          categories: 'Što ti se danas radi?',
          explore: 'Istraži',
          home: 'Početna',
          journal: 'Journal',
          saved: 'Spremljeno',
          latest: 'ZA INSPIRACIJU',
          journalText: 'Priče, ideje i iskustva.',
          journalLink: 'Otvori The Journal',
          savedText: 'Ovdje će se nalaziti tvoji spremljeni sadržaji. Funkcionalnost dodajemo u sljedećoj fazi.',
          exploreText: 'Odaberi kategoriju i istraži aktivnosti na MOVE&TRY platformi.',
          continue: 'NASTAVI →'
        },

        en: {
          intro: 'Your next story starts with curiosity.',
          sub: 'Explore activities, read real experiences and find something new you want to try.',
          discover: 'DISCOVER SOMETHING NEW',
          categories: 'What do you feel like doing today?',
          explore: 'Explore',
          home: 'Home',
          journal: 'Journal',
          saved: 'Saved',
          latest: 'FOR INSPIRATION',
          journalText: 'Stories, ideas and experiences.',
          journalLink: 'Open The Journal',
          savedText: 'Your saved content will appear here. This feature is coming in a later phase.',
          exploreText: 'Choose a category and discover activities on MOVE&TRY.',
          continue: 'CONTINUE →'
        }
      };

      const view = document.getElementById('view');
      const welcome = document.getElementById('welcome');

      let lang = localStorage.getItem(APP_LANGUAGE_KEY);

      if (lang !== 'hr' && lang !== 'en') {
        lang = null;
      }

      let selected = lang || 'hr';
      let tab = 'home';

      function currentLanguage() {
        return lang || selected;
      }

      function translations() {
        return T[currentLanguage()];
      }

      function prefix() {
        return currentLanguage() === 'hr' ? '/hr/' : '/';
      }

      function syncLanguage() {
        localStorage.setItem(
          WEB_LANGUAGE_KEY,
          currentLanguage()
        );
      }

      function navigateTo(path) {
        const url = new URL(path, window.location.origin);

        if (url.origin !== window.location.origin) {
          return;
        }

        if (
          url.pathname.startsWith('/editor/') ||
          url.pathname.startsWith('/app/')
        ) {
          return;
        }

        syncLanguage();

        // Direct navigation, not an iframe.
        // The public PWA manifest scope includes these paths.
        window.location.assign(url.href);
      }

      function categoryCards() {
        const t = translations();

        return CATEGORIES.map(([slug, name, image]) => `
          <a
            class="category"
            href="${prefix()}${slug}.html"
            style="background-image:url('/images/${image}')"
          >
            <strong>${name}</strong>
            <small>${t.explore} →</small>
          </a>
        `).join('');
      }

      function render() {
        const t = translations();

        document.documentElement.lang = currentLanguage();
        document.title = 'MOVE&TRY — ' + t.home;

        document.querySelectorAll('[data-nav]').forEach(node => {
          node.textContent = t[node.dataset.nav];
        });

        document.querySelectorAll('[data-tab]').forEach(button => {
          button.setAttribute(
            'aria-current',
            button.dataset.tab === tab ? 'page' : 'false'
          );
        });

        if (tab === 'home') {
          view.innerHTML = `
            <section class="intro">
              <div class="eyebrow">MOVE&TRY · ${t.discover}</div>
              <h1>${t.intro}</h1>
              <p>${t.sub}</p>
            </section>

            <div class="hero">
              <span>YOU DON'T HAVE TO BE GOOD AT IT. JUST TRY.</span>
            </div>

            <section class="section">
              <div class="eyebrow">${t.discover}</div>
              <h2>${t.categories}</h2>

              <div class="categories">
                ${categoryCards()}
              </div>
            </section>

            <section class="section">
              <div class="eyebrow">${t.latest}</div>
              <h2>The Journal</h2>

              <a class="feature" href="${prefix()}journal.html">
                <span>
                  <strong>${t.journalText}</strong>
                  <small>${t.journalLink}</small>
                </span>
                <span>→</span>
              </a>
            </section>
          `;
        }

        else if (tab === 'explore') {
          view.innerHTML = `
            <section class="placeholder">
              <div class="eyebrow">MOVE&TRY</div>
              <h1>${t.explore}</h1>
              <p>${t.exploreText}</p>

              <div class="categories">
                ${categoryCards()}
              </div>
            </section>
          `;
        }

        else if (tab === 'journal') {
          view.innerHTML = `
            <section class="placeholder">
              <div class="eyebrow">THE JOURNAL</div>
              <h1>The Journal</h1>
              <p>${t.journalText}</p>

              <a class="text-link" href="${prefix()}journal.html">
                ${t.journalLink} →
              </a>
            </section>
          `;
        }

        else {
          view.innerHTML = `
            <section class="placeholder">
              <div class="eyebrow">MOVE&TRY</div>
              <h1>${t.saved}</h1>
              <p>${t.savedText}</p>
            </section>
          `;
        }
      }

      function showLanguageChoice() {
        selected = lang || selected;
        welcome.hidden = false;

        document.querySelectorAll('[data-choice]').forEach(button => {
          button.setAttribute(
            'aria-pressed',
            String(button.dataset.choice === selected)
          );
        });

        document.getElementById('continue').textContent =
          T[selected].continue;
      }

      document.querySelectorAll('[data-choice]').forEach(button => {
        button.addEventListener('click', () => {
          selected = button.dataset.choice;

          document.querySelectorAll('[data-choice]').forEach(choice => {
            choice.setAttribute(
              'aria-pressed',
              String(choice.dataset.choice === selected)
            );
          });

          document.getElementById('continue').textContent =
            T[selected].continue;
        });
      });

      document.getElementById('continue').addEventListener('click', () => {
        lang = selected;

        localStorage.setItem(APP_LANGUAGE_KEY, lang);
        syncLanguage();

        welcome.hidden = true;
        render();
      });

      document.getElementById('language-toggle')
        .addEventListener('click', showLanguageChoice);

      document.querySelectorAll('[data-tab]').forEach(button => {
        button.addEventListener('click', () => {
          tab = button.dataset.tab;
          render();
          window.scrollTo(0, 0);
        });
      });

      view.addEventListener('click', event => {
        const link = event.target.closest('a[href]');

        if (!link || event.defaultPrevented) {
          return;
        }

        const url = new URL(link.href, window.location.origin);

        if (
          url.origin !== window.location.origin ||
          url.pathname.startsWith('/editor/')
        ) {
          return;
        }

        event.preventDefault();
        navigateTo(url.href);
      });

      if (!lang) {
        showLanguageChoice();
      } else {
        syncLanguage();
      }

      render();

      if ('serviceWorker' in navigator && window.isSecureContext) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/app/sw.js', {
            scope: '/app/'
          }).catch(error => {
            console.warn(
              'MOVE&TRY app service worker:',
              error
            );
          });
        });
      }
    })();
  </script>

</body>
</html>
