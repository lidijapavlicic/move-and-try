<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="MOVE&TRY — Discover something new to try.">
  <meta name="robots" content="noindex, nofollow">

  <title>MOVE&TRY — App</title>

  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #f7f6f2;
      --ink: #171916;
      --muted: #697067;
      --green: #1f2a18;
      --line: #dcded6;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.dialog-open { overflow: hidden; }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #758b6b;
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .shell {
      width: 100%;
      max-width: 720px;
      min-height: 100dvh;
      margin: 0 auto;
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
    }

    /* HEADER */

    .top {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 76px;
      padding: 12px 20px;
      padding-top: calc(12px + env(safe-area-inset-top));
      background: var(--bg);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
    }

    .brand img {
      display: block;
      width: auto;
      max-width: 155px;
      height: 43px;
      object-fit: contain;
      object-position: left center;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,.72);
      color: var(--ink);
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .notification-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ad5d38;
    }

    /* HOME INTRO */

    .intro {
      padding: 24px 22px 17px;
    }

    .eyebrow {
      color: #687b61;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .17em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .intro h1 {
      max-width: 580px;
      margin: 12px 0 12px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(37px, 9.3vw, 59px);
      font-weight: 400;
      line-height: 1.09;
      letter-spacing: -.025em;
    }

    .intro p {
      max-width: 460px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* EDGE-TO-EDGE HERO */

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      min-height: 250px;
      margin: 15px 0 25px;
      background: #243227
        url('/images/home-discover.png')
        center center / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0) 36%,
        rgba(0,0,0,.52) 100%
      );
    }

    .hero span {
      position: absolute;
      z-index: 1;
      right: 20px;
      bottom: 20px;
      left: 22px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      line-height: 1.6;
    }

    /* SECTIONS */

    .section {
      padding: 12px 22px 28px;
    }

    .section h2 {
      margin: 7px 0 17px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(29px, 7vw, 35px);
      font-weight: 400;
      line-height: 1.2;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .category {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      min-height: 164px;
      padding: 16px;
      background-color: #e4e6e0;
      background-position: center;
      background-size: cover;
      color: #fff;
    }

    /*
      Nježniji fotografski prikaz:
      svijetli sloj ublažava intenzitet fotografije,
      donji gradijent čuva čitljivost teksta.
    */

    .category::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(246,247,241,.34) 0%,
        rgba(231,235,226,.18) 42%,
        rgba(12,20,15,.67) 100%
      );
    }

    .category strong {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .055em;
      line-height: 1.2;
    }

    .category small {
      margin-top: 7px;
      font-size: 10px;
      font-weight: 700;
      opacity: .95;
    }

    .category:active { transform: scale(.99); }

    /* JOURNAL */

    .journal-section { padding-top: 8px; }

    .feature {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .feature strong {
      display: block;
      font-size: 13px;
      font-weight: 800;
    }

    .feature small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .feature > span:last-child { font-size: 23px; }

    /* SECONDARY TABS */

    .placeholder {
      padding: 32px 22px 45px;
    }

    .placeholder h1 {
      margin: 12px 0;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 43px;
      font-weight: 400;
      line-height: 1.15;
    }

    .placeholder p {
      max-width: 470px;
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .text-link {
      display: inline-block;
      padding: 9px 0;
      border-bottom: 1px solid var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    /* SURPRISE ME — EXPLORE */

    .surprise-box {
      margin: 0 0 26px;
      padding: 22px;
      border: 1px solid var(--line);
      background: #eeefe9;
    }

    .surprise-box h2 {
      margin: 8px 0 10px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 30px;
      font-weight: 400;
    }

    .surprise-box p {
      margin: 0 0 17px;
    }

    .surprise-button {
      padding: 13px 18px;
      border: 0;
      background: var(--green);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .surprise-result {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .surprise-result strong {
      display: block;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .surprise-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    /* BOTTOM APP NAVIGATION */

    .bottom {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: stretch;
      padding:
        10px max(8px, env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      border-top: 1px solid var(--line);
      background: rgba(247,246,242,.98);
      backdrop-filter: blur(12px);
    }

    .bottom button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      min-height: 45px;
      padding: 3px 1px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }

    .bottom button[aria-current="page"] {
      color: var(--green);
    }

    .bottom svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bottom [data-tab="where"] svg {
      width: 24px;
      height: 24px;
    }

    /* WELCOME AND PANELS */
        .overlay {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      overflow-y: auto;
      padding: 26px;
      background: var(--bg);
    }

    .welcome {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .welcome-logo {
      display: block;
      width: 190px;
      max-height: 90px;
      margin: 0 auto;
      object-fit: contain;
    }

    .welcome h1 {
      margin: 35px 0 10px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 37px;
      font-weight: 400;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .choices {
      display: grid;
      gap: 11px;
      margin: 27px 0 20px;
    }

    .choice {
      padding: 17px;
      border: 1px solid var(--line);
      background: #fff;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
    }

    .choice[aria-pressed="true"] {
      border: 2px solid var(--green);
      padding: 16px;
    }

    .primary {
      width: 100%;
      padding: 16px;
      border: 0;
      background: var(--green);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .hint {
      margin-top: 17px;
      font-size: 11px !important;
    }

    .panel-backdrop {
      position: fixed;
      z-index: 25;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: calc(82px + env(safe-area-inset-top)) 14px 18px;
      background: rgba(12,20,15,.38);
    }

    .panel {
      width: 100%;
      max-width: 480px;
      max-height: 78dvh;
      overflow-y: auto;
      padding: 23px;
      background: var(--bg);
      box-shadow: 0 18px 50px rgba(0,0,0,.12);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 18px;
    }

    .panel h2 {
      margin: 5px 0 0;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 29px;
      font-weight: 400;
    }

    .close-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 20px;
    }

    .panel p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .empty-notifications {
      padding: 27px 12px 20px;
      text-align: center;
    }

    .empty-notifications svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.5;
    }

    .setting-label {
      margin: 20px 0 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .settings-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .setting-choice {
      padding: 14px 8px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .setting-choice[aria-pressed="true"] {
      border-color: var(--green);
      background: #e9eee4;
    }

    @media (min-width: 720px) {
      .bottom {
        right: auto;
        left: 50%;
        width: 720px;
        transform: translateX(-50%);
      }

      .hero { min-height: 335px; }

      .category { min-height: 200px; }
    }

    @media (max-width: 360px) {
      .top { padding-right: 15px; padding-left: 15px; }
      .brand img { max-width: 128px; }
      .intro { padding-right: 18px; padding-left: 18px; }
      .section { padding-right: 18px; padding-left: 18px; }
      .bottom button { font-size: 8px; }
      .bottom svg { width: 20px; height: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .category:active { transform: none; }
    }
  </style>
</head>

<body>

  <!-- FIRST-LAUNCH LANGUAGE SELECTION -->

  <div class="overlay" id="welcome" hidden>
    <div class="welcome">
      <img
        class="welcome-logo"
        src="/images/move-and-try-logo.png"
        alt="MOVE&TRY"
      >

      <h1>Choose your language.</h1>
      <p>Odaberi jezik / Select your language</p>

      <div class="choices">
        <button
          class="choice"
          type="button"
          data-choice="hr"
          aria-pressed="true"
        >
          🇭🇷 Hrvatski
        </button>

        <button
          class="choice"
          type="button"
          data-choice="en"
          aria-pressed="false"
        >
          🇬🇧 English
        </button>
      </div>

      <button class="primary" id="continue" type="button">
        NASTAVI →
      </button>

      <p class="hint">
        Jezik možeš promijeniti kasnije. /
        You can change it later.
      </p>
    </div>
  </div>

  <!-- MAIN APP -->

  <div class="shell">

    <header class="top">
      <a class="brand" href="/app/" aria-label="MOVE&TRY početna">
        <img
          src="/images/move-and-try-logo.png"
          alt="MOVE&TRY"
        >
      </a>

      <div class="top-actions">

        <button
          class="icon-button"
          id="notifications-button"
          type="button"
          aria-label="Centar obavijesti"
          aria-haspopup="dialog"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>
          <span class="notification-dot" id="notification-dot" hidden></span>
        </button>

        <button
          class="icon-button"
          id="settings-button"
          type="button"
          aria-label="Postavke"
          aria-haspopup="dialog"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l-1.9 1.9A1.7 1.7 0 0 0 16 18.4l-.9.4a1.7 1.7 0 0 0-1-1.55V21h-2.7v-.65a1.7 1.7 0 0 0-1-1.55l-.9-.4a1.7 1.7 0 0 0-1.87.34l-1.9-1.9A1.7 1.7 0 0 0 6.1 15l-.4-.9a1.7 1.7 0 0 0-1.55-1H3.5v-2.7h.65a1.7 1.7 0 0 0 1.55-1l.4-.9a1.7 1.7 0 0 0-.34-1.87l1.9-1.9A1.7 1.7 0 0 0 9.5 5.1l.9-.4a1.7 1.7 0 0 0 1-1.55V2.5h2.7v.65a1.7 1.7 0 0 0 1 1.55l.9.4a1.7 1.7 0 0 0 1.87-.34l1.9 1.9A1.7 1.7 0 0 0 19.4 8.5l.4.9a1.7 1.7 0 0 0 1.55 1H22v2.7h-.65a1.7 1.7 0 0 0-1.55 1z"/>
          </svg>
        </button>

      </div>
    </header>

    <main id="view" tabindex="-1"></main>

  </div>

  <!-- FIVE-ITEM APP NAVIGATION -->

  <nav class="bottom" aria-label="App navigation">

    <button type="button" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 10 9-7 9 7v10H3z"/>
        <path d="M9 20v-7h6v7"/>
      </svg>
      <span data-nav="home">Početna</span>
    </button>

    <button type="button" data-tab="explore">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m16 16 5 5"/>
      </svg>
      <span data-nav="explore">Istraži</span>
    </button>

    <button type="button" data-tab="where">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      <span data-nav="where">Gdje probati</span>
    </button>

    <button type="button" data-tab="journal">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/>
        <path d="M8 9h7M8 13h7"/>
      </svg>
      <span data-nav="journal">Journal</span>
    </button>

    <button type="button" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 3h12v18l-6-4-6 4z"/>
      </svg>
      <span data-nav="saved">Spremljeno</span>
    </button>

  </nav>

  <!-- NOTIFICATIONS PANEL -->

  <div class="panel-backdrop" id="notifications-panel" hidden>
    <section
      class="panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="notifications-title"
      tabindex="-1"
    >
      <div class="panel-head">
        <div>
          <div class="eyebrow">MOVE&TRY</div>
          <h2 id="notifications-title">Obavijesti</h2>
        </div>
        <button
          class="close-button"
          type="button"
          data-close-panel
          aria-label="Zatvori"
        >×</button>
      </div>

      <div class="empty-notifications">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
          <path d="M10 21h4"/>
        </svg>
        <p id="notifications-empty">
          Još nema obavijesti.
        </p>
      </div>
    </section>
  </div>

  <!-- SETTINGS PANEL -->

  <div class="panel-backdrop" id="settings-panel" hidden>
    <section
      class="panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="settings-title"
      tabindex="-1"
    >
      <div class="panel-head">
        <div>
          <div class="eyebrow">MOVE&TRY</div>
          <h2 id="settings-title">Postavke</h2>
        </div>
        <button
          class="close-button"
          type="button"
          data-close-panel
          aria-label="Zatvori"
        >×</button>
      </div>

      <div class="setting-label" id="language-label">Jezik aplikacije</div>

      <div class="settings-choices">
        <button
          class="setting-choice"
          type="button"
          data-setting-language="hr"
        >
          🇭🇷 Hrvatski
        </button>
        <button
          class="setting-choice"
          type="button"
          data-setting-language="en"
        >
          🇬🇧 English
        </button>
      </div>

      <p id="settings-note">
        Jezik možeš promijeniti u bilo kojem trenutku.
      </p>
    </section>
  </div>

  <script>
    (() => {
      'use strict';

      const APP_LANGUAGE_KEY = 'moveandtry_app_language';
      const WEB_LANGUAGE_KEY = 'moveandtry_language';
      const SESSION_KEY = 'moveandtry_public_app_session';

      // Only published, known activity destinations. Add new entries when published.
      const SURPRISE_ACTIVITIES = [
        { hr: 'Trčanje', en: 'Running', slug: 'running.html' },
        { hr: 'Pole dance', en: 'Pole dance', slug: 'pole-dance.html' },
        { hr: 'Izrada prirodnih parfema', en: 'Natural perfume making', slug: 'natural-perfume-making.html' }
      ];

      let lastSurpriseSlug = null;

      const CATEGORIES = [
        ['move', 'MOVE', 'category-move.webp'],
        ['learn', 'LEARN', 'category-learn.webp'],
        ['create', 'CREATE', 'category-create.webp'],
        ['explore', 'EXPLORE', 'category-explore.webp'],
        ['dare', 'DARE', 'category-dare.webp'],
        ['care', 'CARE', 'category-care.webp']
      ];

      const T = {
        hr: {
          intro: 'Tvoja sljedeća priča počinje znatiželjom.',
          sub: 'Istraži aktivnosti, pročitaj stvarna iskustva i pronađi nešto novo što želiš isprobati.',
          discover: 'OTKRIJ NEŠTO NOVO',
          categories: 'Što ti se danas radi?',
          explore: 'Istraži',
          home: 'Početna',
          where: 'Gdje probati',
          journal: 'Journal',
          saved: 'Spremljeno',
          latest: 'ZA INSPIRACIJU',
          journalText: 'Priče, ideje i iskustva.',
          journalLink: 'Otvori The Journal',
          savedText: 'Ovdje će se nalaziti tvoji spremljeni sadržaji. Funkcionalnost dodajemo u sljedećoj fazi.',
          exploreText: 'Odaberi kategoriju i istraži aktivnosti na MOVE&TRY platformi.',
          continue: 'NASTAVI →',
          notifications: 'Obavijesti',
          noNotifications: 'Još nema obavijesti.',
          settings: 'Postavke',
          languageLabel: 'Jezik aplikacije',
          settingsNote: 'Jezik možeš promijeniti u bilo kojem trenutku.',
          surpriseTitle: 'Iznenadi me',
          surpriseText: 'Ne znaš što bi isprobala? Prepusti izbor slučaju.',
          surpriseButton: 'IZNENADI ME →',
          surpriseAgain: 'Pokušaj ponovno',
          surpriseOpen: 'POGLEDAJ AKTIVNOST →',
          close: 'Zatvori'
        },

        en: {
          intro: 'Your next story starts with curiosity.',
          sub: 'Explore activities, read real experiences and find something new you want to try.',
          discover: 'DISCOVER SOMETHING NEW',
          categories: 'What do you feel like doing today?',
          explore: 'Explore',
          home: 'Home',
          where: 'Where to Try',
                    journal: 'Journal',
          saved: 'Saved',
          latest: 'FOR INSPIRATION',
          journalText: 'Stories, ideas and experiences.',
          journalLink: 'Open The Journal',
          savedText: 'Your saved content will appear here. This feature is coming in a later phase.',
          exploreText: 'Choose a category and discover activities on MOVE&TRY.',
          continue: 'CONTINUE →',
          notifications: 'Notifications',
          noNotifications: 'No notifications yet.',
          settings: 'Settings',
          languageLabel: 'App language',
          settingsNote: 'You can change the language at any time.',
          surpriseTitle: 'Surprise me',
          surpriseText: 'Not sure what to try? Let curiosity choose.',
          surpriseButton: 'SURPRISE ME →',
          surpriseAgain: 'Try again',
          surpriseOpen: 'EXPLORE ACTIVITY →',
          close: 'Close'
        }
      };

      const view = document.getElementById('view');
      const welcome = document.getElementById('welcome');

      let lang = null;

      try {
        lang = localStorage.getItem(APP_LANGUAGE_KEY);
      } catch (_) {}

      if (lang !== 'hr' && lang !== 'en') {
        lang = null;
      }

      let selected = lang || 'hr';

      const requestedTab =
        new URLSearchParams(window.location.search).get('tab');

      let tab =
        ['home', 'explore', 'saved'].includes(requestedTab)
          ? requestedTab
          : 'home';

      let lastPanelTrigger = null;

      // Legacy /app/?tab=journal links should also skip the intermediate screen.
      if (requestedTab === 'journal' && lang) {
        navigateTo(prefix() + 'journal.html');
      }

      function currentLanguage() {
        return lang || selected;
      }

      function translations() {
        return T[currentLanguage()];
      }

      function prefix() {
        return currentLanguage() === 'hr' ? '/hr/' : '/';
      }

      function syncLanguage() {
        try {
          localStorage.setItem(WEB_LANGUAGE_KEY, currentLanguage());
        } catch (_) {}
      }

      function navigateTo(path) {
        const url = new URL(path, window.location.origin);

        if (url.origin !== window.location.origin) return;

        if (
          url.pathname.startsWith('/editor/') ||
          url.pathname.startsWith('/app/')
        ) {
          return;
        }

        syncLanguage();

        url.searchParams.set('source', 'moveandtry-app');

        try {
          sessionStorage.setItem(SESSION_KEY, '1');
        } catch (_) {}

        window.location.assign(url.href);
      }

      function categoryCards() {
        const t = translations();

        return CATEGORIES.map(([slug, name, image]) => `
          <a
            class="category"
            href="${prefix()}${slug}.html"
            style="background-image:url('/images/${image}')"
          >
            <strong>${name}</strong>
            <small>${t.explore} →</small>
          </a>
        `).join('');
      }

      function updateLanguageUI() {
        const t = translations();

        document.documentElement.lang = currentLanguage();
        document.title = 'MOVE&TRY — ' + t.home;

        document.querySelectorAll('[data-nav]').forEach(node => {
          node.textContent = t[node.dataset.nav];
        });

        document.getElementById('notifications-title').textContent =
          t.notifications;

        document.getElementById('notifications-empty').textContent =
          t.noNotifications;

        document.getElementById('settings-title').textContent =
          t.settings;

        document.getElementById('language-label').textContent =
          t.languageLabel;

        document.getElementById('settings-note').textContent =
          t.settingsNote;

        document.getElementById('notifications-button')
          .setAttribute('aria-label', t.notifications);

        document.getElementById('settings-button')
          .setAttribute('aria-label', t.settings);

        document.querySelectorAll('[data-close-panel]').forEach(button => {
          button.setAttribute('aria-label', t.close);
        });

        document.querySelectorAll('[data-setting-language]').forEach(button => {
          button.setAttribute(
            'aria-pressed',
            String(button.dataset.settingLanguage === currentLanguage())
          );
        });

        document.querySelectorAll('[data-tab]').forEach(button => {
          const isCurrent =
            button.dataset.tab !== 'where' &&
            button.dataset.tab === tab;

          button.setAttribute(
            'aria-current',
            isCurrent ? 'page' : 'false'
          );
        });
      }

      function render() {
        const t = translations();

        updateLanguageUI();

        if (tab === 'home') {
          view.innerHTML = `
            <section class="intro">
              <div class="eyebrow">
                MOVE&TRY · ${t.discover}
              </div>

              <h1>${t.intro}</h1>
              <p>${t.sub}</p>
            </section>

            <div class="hero" role="img"
              aria-label="MOVE&TRY — Discover something new">
              <span>
                YOU DON'T HAVE TO BE GOOD AT IT. JUST TRY.
              </span>
            </div>

            <section class="section">
              <div class="eyebrow">${t.discover}</div>
              <h2>${t.categories}</h2>

              <div class="categories">
                ${categoryCards()}
              </div>
            </section>

            <section class="section journal-section">
              <div class="eyebrow">${t.latest}</div>
              <h2>The Journal</h2>

              <a class="feature" href="${prefix()}journal.html">
                <span>
                  <strong>${t.journalText}</strong>
                  <small>${t.journalLink}</small>
                </span>
                <span aria-hidden="true">→</span>
              </a>
            </section>
          `;
        }

        else if (tab === 'explore') {
          view.innerHTML = `
            <section class="placeholder">
              <div class="eyebrow">MOVE&TRY</div>
              <h1>${t.explore}</h1>
              <p>${t.exploreText}</p>

              <div class="surprise-box">
                <div class="eyebrow">MOVE&TRY</div>
                <h2>${t.surpriseTitle}</h2>
                <p>${t.surpriseText}</p>
                <button type="button" class="surprise-button" id="surprise-pick">${t.surpriseButton}</button>
                <div class="surprise-result" id="surprise-result" hidden aria-live="polite"></div>
              </div>

              <div class="categories">
                ${categoryCards()}
              </div>
            </section>
          `;
        }

        else if (tab === 'saved') {
          view.innerHTML = `
            <section class="placeholder">
              <div class="eyebrow">MOVE&TRY</div>
              <h1>${t.saved}</h1>
              <p>${t.savedText}</p>
            </section>
          `;
        }
      }

      function showLanguageChoice() {
        selected = lang || selected;
        welcome.hidden = false;

        document.querySelectorAll('[data-choice]').forEach(button => {
          button.setAttribute(
            'aria-pressed',
            String(button.dataset.choice === selected)
          );
        });

        document.getElementById('continue').textContent =
          T[selected].continue;
      }

      function closePanels() {
        document.getElementById('notifications-panel').hidden = true;
        document.getElementById('settings-panel').hidden = true;

        document.body.classList.remove('dialog-open');

        if (lastPanelTrigger) {
          lastPanelTrigger.focus();
          lastPanelTrigger = null;
        }
      }

      function openPanel(id, trigger) {
        closePanels();

        lastPanelTrigger = trigger;

        const panel = document.getElementById(id);
        panel.hidden = false;

        document.body.classList.add('dialog-open');

        panel.querySelector('.panel').focus();
      }

      document.querySelectorAll('[data-choice]').forEach(button => {
        button.addEventListener('click', () => {
          selected = button.dataset.choice;

          document.querySelectorAll('[data-choice]').forEach(choice => {
            choice.setAttribute(
              'aria-pressed',
              String(choice.dataset.choice === selected)
            );
          });

          document.getElementById('continue').textContent =
            T[selected].continue;
        });
      });

      document.getElementById('continue').addEventListener('click', () => {
        lang = selected;

        try {
          localStorage.setItem(APP_LANGUAGE_KEY, lang);
        } catch (_) {}

        syncLanguage();

        welcome.hidden = true;
        if (requestedTab === 'journal') {
          navigateTo(prefix() + 'journal.html');
          return;
        }
        render();
      });

      document.querySelectorAll('[data-setting-language]').forEach(button => {
        button.addEventListener('click', () => {
          lang = button.dataset.settingLanguage;
          selected = lang;

          try {
            localStorage.setItem(APP_LANGUAGE_KEY, lang);
          } catch (_) {}

          syncLanguage();
          render();
        });
      });

      document.getElementById('notifications-button')
        .addEventListener('click', event => {
          openPanel('notifications-panel', event.currentTarget);
        });

      document.getElementById('settings-button')
        .addEventListener('click', event => {
          openPanel('settings-panel', event.currentTarget);
        });

      document.querySelectorAll('[data-close-panel]').forEach(button => {
        button.addEventListener('click', closePanels);
      });

      document.querySelectorAll('.panel-backdrop').forEach(backdrop => {
        backdrop.addEventListener('click', event => {
          if (event.target === backdrop) closePanels();
        });
      });

      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') {
          closePanels();
        }
      });

      document.querySelectorAll('[data-tab]').forEach(button => {
        button.addEventListener('click', () => {
          const target = button.dataset.tab;

          if (target === 'where') {
            navigateTo(prefix() + 'where-to-try.html');
            return;
          }

          if (target === 'journal') {
            navigateTo(prefix() + 'journal.html');
            return;
          }

          tab = target;

          const url = new URL(window.location.href);

          if (tab === 'home') {
            url.searchParams.delete('tab');
          } else {
            url.searchParams.set('tab', tab);
          }

          history.replaceState(null, '', url.href);

          render();
          window.scrollTo(0, 0);
        });
      });

      view.addEventListener('click', event => {
        const surpriseButton = event.target.closest('#surprise-pick, #surprise-again');
        if (surpriseButton) {
          const choices = SURPRISE_ACTIVITIES.filter(item =>
            item.slug !== lastSurpriseSlug
          );
          const pool = choices.length ? choices : SURPRISE_ACTIVITIES;
          const picked = pool[Math.floor(Math.random() * pool.length)];
          lastSurpriseSlug = picked.slug;
          const t = translations();
          const result = document.getElementById('surprise-result');
          result.hidden = false;
          result.innerHTML = `
            <strong>${picked[currentLanguage()]}</strong>
            <div class="surprise-actions">
              <a class="text-link" href="${prefix()}${picked.slug}">${t.surpriseOpen}</a>
              <button type="button" class="surprise-button" id="surprise-again">${t.surpriseAgain}</button>
            </div>
          `;
          return;
        }

        const link = event.target.closest('a[href]');

        if (
          !link ||
          event.defaultPrevented ||
          event.button !== 0 ||
          event.metaKey ||
          event.ctrlKey ||
          event.shiftKey ||
          event.altKey
        ) {
          return;
        }

        const url = new URL(link.href, window.location.origin);

        if (
          url.origin !== window.location.origin ||
          url.pathname.startsWith('/editor/')
        ) {
          return;
        }

        event.preventDefault();
        navigateTo(url.href);
      });

      if (!lang) {
        showLanguageChoice();
      } else {
        syncLanguage();
      }

      render();

      if ('serviceWorker' in navigator && window.isSecureContext) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/app/sw.js', {
            scope: '/app/'
          }).catch(error => {
            console.warn('MOVE&TRY app service worker:', error);
          });
        });
      }
    })();
  </script>

</body>
</html>
