
<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="MOVE&TRY — Discover something new to try.">
  <meta name="robots" content="noindex, nofollow">

  <title>MOVE&TRY — App</title>


  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #f7f6f2;
      --ink: #171916;
      --muted: #697067;
      --green: #1f2a18;
      --line: #dcded6;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'Manrope', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body.dialog-open { overflow: hidden; }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid #758b6b;
      outline-offset: 3px;
    }

    [hidden] { display: none !important; }

    .shell {
      width: 100%;
      max-width: 720px;
      min-height: 100dvh;
      margin: 0 auto;
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
    }

    /* HEADER */

    .top {
      position: relative;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 76px;
      padding: 12px 20px;
      padding-top: calc(12px + env(safe-area-inset-top));
      background: var(--bg);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      min-width: 0;
    }

    .brand img {
      display: block;
      width: auto;
      max-width: 155px;
      height: 43px;
      object-fit: contain;
      object-position: left center;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .icon-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255,255,255,.72);
      color: var(--ink);
    }

    .icon-button svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .notification-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ad5d38;
    }

    /* HOME INTRO */

    .intro {
      padding: 24px 22px 17px;
    }

    .eyebrow {
      color: #687b61;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .17em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .intro h1 {
      max-width: 580px;
      margin: 12px 0 12px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(37px, 9.3vw, 59px);
      font-weight: 400;
      line-height: 1.09;
      letter-spacing: -.025em;
    }

    .intro p {
      max-width: 460px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* EDGE-TO-EDGE HERO */

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      min-height: 250px;
      margin: 15px 0 25px;
      background: #243227
        url('/images/home-discover.png')
        center center / cover no-repeat;
    }

    .hero::after {
      content: "";
      position: absolute;
      z-index: 0;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0) 36%,
        rgba(0,0,0,.52) 100%
      );
    }

    .hero span {
      position: absolute;
      z-index: 1;
      right: 20px;
      bottom: 20px;
      left: 22px;
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .13em;
      line-height: 1.6;
    }

    /* SECTIONS */

    .section {
      padding: 12px 22px 28px;
    }

    .section h2 {
      margin: 7px 0 17px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: clamp(29px, 7vw, 35px);
      font-weight: 400;
      line-height: 1.2;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .category {
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      min-height: 164px;
      padding: 16px;
      background-color: #e4e6e0;
      background-position: center;
      background-size: cover;
      color: #fff;
    }

    /*
      Nježniji fotografski prikaz:
      svijetli sloj ublažava intenzitet fotografije,
      donji gradijent čuva čitljivost teksta.
    */

    .category::before {
      content: "";
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(246,247,241,.34) 0%,
        rgba(231,235,226,.18) 42%,
        rgba(12,20,15,.67) 100%
      );
    }

    .category strong {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .055em;
      line-height: 1.2;
    }

    .category small {
      margin-top: 7px;
      font-size: 10px;
      font-weight: 700;
      opacity: .95;
    }

    .category:active { transform: scale(.99); }

    /* JOURNAL */

    .journal-section { padding-top: 8px; }

    .feature {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .feature strong {
      display: block;
      font-size: 13px;
      font-weight: 800;
    }

    .feature small {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .feature > span:last-child { font-size: 23px; }

    /* SECONDARY TABS */

    .placeholder {
      padding: 32px 22px 45px;
    }

    .placeholder h1 {
      margin: 12px 0;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 43px;
      font-weight: 400;
      line-height: 1.15;
    }

    .placeholder p {
      max-width: 470px;
      margin: 0 0 25px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.75;
    }

    .text-link {
      display: inline-block;
      padding: 9px 0;
      border-bottom: 1px solid var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    /* SURPRISE ME — EXPLORE */

    .surprise-box {
      margin: 0 0 26px;
      padding: 22px;
      border: 1px solid var(--line);
      background: #eeefe9;
    }

    .surprise-box h2 {
      margin: 8px 0 10px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 30px;
      font-weight: 400;
    }

    .surprise-box p {
      margin: 0 0 17px;
    }

    .surprise-button {
      padding: 13px 18px;
      border: 0;
      background: var(--green);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .surprise-result {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }

    .surprise-result strong {
      display: block;
      margin-bottom: 12px;
      font-size: 15px;
    }

    .surprise-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
    }

    /* SURPRISE ME — 3D DICE */

    .dice-area {
      display: grid;
      justify-items: center;
      gap: 14px;
      padding: 6px 0 18px;
    }

    .dice-stage {
      width: 120px;
      height: 120px;
      display: grid;
      place-items: center;
      perspective: 700px;
    }

    .dice-cube {
      position: relative;
      width: 76px;
      height: 76px;
      transform-style: preserve-3d;
      transform: rotateX(-22deg) rotateY(-32deg);
      transition: transform 1.35s cubic-bezier(.18,.8,.18,1);
    }

    .dice-face {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border: 2px solid #526247;
      border-radius: 12px;
      background: #f8f9f4;
      box-shadow: inset 0 0 18px rgba(31,42,24,.07);
      backface-visibility: hidden;
    }

    .dice-face:nth-child(1) { transform: translateZ(38px); }
    .dice-face:nth-child(2) { transform: rotateY(180deg) translateZ(38px); }
    .dice-face:nth-child(3) { transform: rotateY(90deg) translateZ(38px); }
    .dice-face:nth-child(4) { transform: rotateY(-90deg) translateZ(38px); }
    .dice-face:nth-child(5) { transform: rotateX(90deg) translateZ(38px); }
    .dice-face:nth-child(6) { transform: rotateX(-90deg) translateZ(38px); }

    .dice-pips {
      width: 48px;
      height: 48px;
      display: grid;
      grid-template-columns: repeat(3,1fr);
      grid-template-rows: repeat(3,1fr);
      gap: 3px;
    }

    .dice-pip {
      width: 9px;
      height: 9px;
      align-self: center;
      justify-self: center;
      border-radius: 50%;
      background: var(--green);
    }

    .dice-trigger {
      width: 100%;
      max-width: 260px;
    }

    .dice-trigger:disabled {
      cursor: wait;
      opacity: .75;
    }

    .dice-caption {
      margin: 0 !important;
      text-align: center;
      font-size: 11px !important;
    }

    .surprise-result { text-align: center; }
    .surprise-actions { justify-content: center; }

    @media (prefers-reduced-motion: reduce) {
      .dice-cube { transition: none; }
    }

    /* BOTTOM APP NAVIGATION */

    .bottom {
      position: fixed;
      z-index: 10;
      right: 0;
      bottom: 0;
      left: 0;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: stretch;
      padding:
        10px max(8px, env(safe-area-inset-right))
        calc(10px + env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      border-top: 1px solid var(--line);
      background: rgba(247,246,242,.98);
      backdrop-filter: blur(12px);
    }

    .bottom button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-width: 0;
      min-height: 45px;
      padding: 3px 1px;
      border: 0;
      background: transparent;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      line-height: 1.2;
      text-align: center;
    }

    .bottom button[aria-current="page"] {
      color: var(--green);
    }

    .bottom svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bottom [data-tab="where"] svg {
      width: 24px;
      height: 24px;
    }

    /* WELCOME AND PANELS */

    .overlay {
      position: fixed;
      z-index: 30;
      inset: 0;
      display: grid;
      place-items: center;
      overflow-y: auto;
      padding: 26px;
      background: var(--bg);
    }

    .welcome {
      width: 100%;
      max-width: 390px;
      text-align: center;
    }

    .welcome-logo {
      display: block;
      width: 190px;
      max-height: 90px;
      margin: 0 auto;
      object-fit: contain;
    }

    .welcome h1 {
      margin: 35px 0 10px;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 37px;
      font-weight: 400;
    }

    .welcome p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .choices {
      display: grid;
      gap: 11px;
      margin: 27px 0 20px;
    }

    .choice {
      padding: 17px;
      border: 1px solid var(--line);
      background: #fff;
      text-align: left;
      font-size: 14px;
      font-weight: 700;
    }

    .choice[aria-pressed="true"] {
      border: 2px solid var(--green);
      padding: 16px;
    }

    .primary {
      width: 100%;
      padding: 16px;
      border: 0;
      background: var(--green);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .hint {
      margin-top: 17px;
      font-size: 11px !important;
    }

    .panel-backdrop {
      position: fixed;
      z-index: 25;
      inset: 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: calc(82px + env(safe-area-inset-top)) 14px 18px;
      background: rgba(12,20,15,.38);
    }

    .panel {
      width: 100%;
      max-width: 480px;
      max-height: 78dvh;
      overflow-y: auto;
      padding: 23px;
      background: var(--bg);
      box-shadow: 0 18px 50px rgba(0,0,0,.12);
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 18px;
    }

    .panel h2 {
      margin: 5px 0 0;
      font-family: 'DM Serif Display', Georgia, serif;
      font-size: 29px;
      font-weight: 400;
    }

    .close-button {
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 20px;
    }

    .panel p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* PUSH NOTIFICATIONS */

    .push-control {
      padding: 16px 0 4px;
      border-top: 1px solid var(--line);
    }

    .push-control button {
      width: 100%;
      padding: 14px;
      border: 0;
      background: var(--green);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
    }

    .push-control button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .push-control p {
      margin: 12px 0;
    }

    .empty-notifications {
      padding: 27px 12px 20px;
      text-align: center;
    }

    .empty-notifications svg {
      width: 30px;
      height: 30px;
      fill: none;
      stroke: var(--muted);
      stroke-width: 1.5;
    }

    .setting-label {
      margin: 20px 0 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .settings-choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .setting-choice {
      padding: 14px 8px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 12px;
      font-weight: 700;
    }

    .privacy-choice { width: 100%; min-height: 44px; text-align: left; padding-left: 15px; }

    .setting-choice[aria-pressed="true"] {
      border-color: var(--green);
      background: #e9eee4;
    }

    @media (min-width: 720px) {
      .bottom {
        right: auto;
        left: 50%;
        width: 720px;
        transform: translateX(-50%);
      }

      .hero { min-height: 335px; }

      .category { min-height: 200px; }
    }

    @media (max-width: 360px) {
      .top { padding-right: 15px; padding-left: 15px; }
      .brand img { max-width: 128px; }
      .intro { padding-right: 18px; padding-left: 18px; }
      .section { padding-right: 18px; padding-left: 18px; }
      .bottom button { font-size: 8px; }
      .bottom svg { width: 20px; height: 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .category:active { transform: none; }
    }
    .push-categories { margin: 20px 0; padding: 16px; border: 1px solid var(--line); border-radius: 12px; }
    .push-categories legend { font-weight: 800; padding: 0 6px; }
    .push-category-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 10px; margin: 14px 0; }

    .push-category-grid label { display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
    .push-category-grid input { width: 19px; height: 19px; accent-color: var(--green); }
    .push-save { padding: 12px 16px; border: 0; background: var(--green); color: white; font-weight: 800; cursor: pointer; }
    .push-save:disabled { opacity: .5; cursor: wait; }
  </style>
  <link rel="stylesheet" href="/consent.css">
</head>

<body>

  <!-- FIRST-LAUNCH LANGUAGE SELECTION -->

  <div class="overlay" id="welcome" hidden>
    <div class="welcome">
      <img
        class="welcome-logo"
        src="/images/move-and-try-logo.png"
        alt="MOVE&TRY"
      >

      <h1>Choose your language.</h1>
      <p>Odaberi jezik / Select your language</p>

      <div class="choices">
        <button
          class="choice"
          type="button"
          data-choice="hr"
          aria-pressed="true"
        >
          🇭🇷 Hrvatski
        </button>

        <button
          class="choice"
          type="button"
          data-choice="en"
          aria-pressed="false"
        >
          🇬🇧 English
        </button>
      </div>

      <button class="primary" id="continue" type="button">
        NASTAVI →
      </button>

      <p class="hint">
        Jezik možeš promijeniti kasnije. /
        You can change it later.
      </p>
    </div>
  </div>

  <!-- MAIN APP -->

  <div class="shell">

    <header class="top">
      <a class="brand" href="/app/" aria-label="MOVE&TRY početna">
        <img
          src="/images/move-and-try-logo.png"
          alt="MOVE&TRY"
        >
      </a>

      <div class="top-actions">

        <button
          class="icon-button"
          id="notifications-button"
          type="button"
          aria-label="Centar obavijesti"
          aria-haspopup="dialog"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/>
            <path d="M10 21h4"/>
          </svg>
          <span class="notification-dot" id="notification-dot" hidden></span>
        </button>

        <button
          class="icon-button"
          id="settings-button"
          type="button"
          aria-label="Postavke"
          aria-haspopup="dialog"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.8 1.8-.06-.06A1.7 1.7 0 0 0 16.06 18a1.7 1.7 0 0 0-1.06 1.57V20h-6v-.43A1.7 1.7 0 0 0 7.94 18a1.7 1.7 0 0 0-1.88.34l-.06.06-1.8-1.8.06-.06A1.7 1.7 0 0 0 4.6 14.66 1.7 1.7 0 0 0 3 13.6H2v-3h1a1.7 1.7 0 0 0 1.6-1.06 1.7 1.7 0 0 0-.34-1.88L4.2 7.6l1.8-1.8.06.06A1.7 1.7 0 0 0 7.94 6.2 1.7 1.7 0 0 0 9 4.63V4h6v.63a1.7 1.7 0 0 0 1.06 1.57 1.7 1.7 0 0 0 1.88-.34L18 5.8l1.8 1.8-.06.06A1.7 1.7 0 0 0 19.4 9.54 1.7 1.7 0 0 0 21 10.6h1v3h-1A1.7 1.7 0 0 0 19.4 15z"/>
          </svg>
        </button>

      </div>
    </header>

    <main id="view" tabindex="-1"></main>

  </div>

  <!-- FIVE-ITEM APP NAVIGATION -->

  <nav class="bottom" aria-label="App navigation">

    <button type="button" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m3 10 9-7 9 7v10H3z"/>
        <path d="M9 20v-7h6v7"/>
      </svg>
      <span data-nav="home">Početna</span>
    </button>

    <button type="button" data-tab="explore">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/>
        <path d="m16 16 5 5"/>
      </svg>
      <span data-nav="explore">Istraži</span>
    </button>

    <button type="button" data-tab="where">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      <span data-nav="where">Gdje probati</span>
    </button>

    <button type="button" data-tab="journal">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/>
        <path d="M8 9h7M8 13h7"/>
      </svg>
      <span data-nav="journal">Journal</span>
    </button>

    <button type="button" data-tab="saved">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 3h12v18l-6-4-6 4z"/>
      </svg>
      <span data-nav="saved">Spremljeno</span>
    </button>

  </nav>

  <!-- NOTIFICATIONS PANEL -->

  <div class="panel-backdrop" id="notifications-panel" hidden>
    <section
      class="panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="notifications-title"
      tabindex="-1"
    >
      <div class="panel-head">
        <div>

  <script>
    (() => {
      'use strict';

      const APP_LANGUAGE_KEY = 'moveandtry_app_language';

      const SESSION_KEY = 'moveandtry_public_app_session';

      // Public catalogue is maintained in /data/activities.json.
      let surpriseActivities = [];
      let lastSurpriseId = null;
      let diceBusy = false;
      let diceTurns = 0;
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

      async function loadSurpriseActivities() {
        try {
          const response = await fetch('/data/activities.json', { cache: 'no-cache' });
          if (!response.ok) throw new Error('Catalogue HTTP ' + response.status);
          const data = await response.json();
          if (!data || !Array.isArray(data.activities)) throw new Error('Invalid catalogue');
          surpriseActivities = data.activities.filter(item =>
            item.published === true && item.includeInSurprise === true &&
            item.id && item.name && item.name.hr && item.name.en &&
            item.url && /^\/hr\/[a-z0-9-]+\.html$/.test(item.url.hr) &&
            /^\/[a-z0-9-]+\.html$/.test(item.url.en)

        } catch (error) {
          console.warn('MOVE&TRY activity catalogue:', error);
          surpriseActivities = [];
        }
        const pick = document.getElementById('surprise-pick');
        if (pick) pick.disabled = !surpriseActivities.length;
        const note = document.getElementById('dice-caption');
        if (note) note.textContent = surpriseActivities.length
          ? translations().diceReady
          : translations().diceUnavailable;
      }

      function diceFaces() {
        const layouts = [

          </div></div>`).join('');
      }

      const I18N = {
        hr: {
          home: 'Početna', explore: 'Istraži', where: 'Gdje probati', journal: 'Journal', saved: 'Spremljeno',
          hello: 'Tvoja sljedeća priča počinje ovdje.', intro: 'Otkrij aktivnosti, ideje i ljude koji te mogu potaknuti da isprobaš nešto novo.',
          discover: 'OTKRIJ NEŠTO NOVO', categories: 'Istraži po kategorijama',
          categoryHint: 'Odaberi ono što te zanima.', journalTitle: 'The Journal',
          journalDesc: 'Priče, iskustva i ljudi iza novih početaka.', journalOpen: 'Otvori Journal',
          exploreTitle: 'Što želiš isprobati?', exploreDesc: 'Pronađi inspiraciju u šest MOVE&TRY kategorija.',
          diceTitle: 'Surprise Me', diceDesc: 'Prepusti slučajnosti izbor svoje sljedeće aktivnosti.',
          diceButton: 'BACi KOCKICU', diceBusy: 'KOCKICA SE VRTI…', diceReady: 'Pritisni gumb i otkrij aktivnost.',
          diceUnavailable: 'Trenutačno nema dostupnih aktivnosti za nasumičan odabir.',
          diceResult: 'Tvoj prijedlog:', diceOpen: 'Pogledaj aktivnost', diceAgain: 'Pokušaj ponovno',
          whereTitle: 'Gdje probati?', whereDesc: 'Otkrij mjesta i ljude uz koje možeš napraviti prvi korak.',
          whereOpen: 'Istraži mogućnosti', savedTitle: 'Spremljeno',
          savedDesc: 'Tvoje spremljene aktivnosti i članci pojavit će se ovdje kada omogućimo spremanje sadržaja.',
          settings: 'Postavke', notifications: 'Obavijesti', noNotifications: 'Još nema obavijesti.',
          languageLabel: 'Jezik aplikacije', settingsNote: 'Jezik možeš promijeniti u bilo kojem trenutku.',
          privacyLabel: 'Privatnost', privacyButton: 'Privatnost i kolačići →',
          close: 'Zatvori', pushUnsupported: 'Push obavijesti nisu podržane u ovom pregledniku.',
          pushDenied: 'Obavijesti su blokirane u postavkama preglednika.',
          pushEnabled: 'Obavijesti su dopuštene na ovom uređaju.',

          pushManage: 'Upravljaj obavijestima u postavkama uređaja.',
          pushCheck: 'Provjeri status obavijesti', pushChecking: 'Provjeravam…',
          pushTurnOn: 'Uključi obavijesti', pushTurnOff: 'Isključi obavijesti', pushSave: 'Spremi kategorije',
          pushCategories: 'Odaberi kategorije obavijesti', pushSaving: 'Spremam…', pushSaved: 'Kategorije su spremljene.',
          pushSelect: 'Odaberi barem jednu kategoriju.', pushError: 'Spremanje nije uspjelo. Provjeri vezu i pokušaj ponovno.',

          categoryMove: 'Pokreni se', categoryCreate: 'Stvaraj', categoryLearn: 'Nauči',
          categoryExplore: 'Istraži', categoryDare: 'Odvaži se', categoryCare: 'Brini o sebi',
          openCategory: 'Otvori kategoriju', access: 'Pristupačnost'
        },
        en: {
          home: 'Home', explore: 'Explore', where: 'Where to Try', journal: 'Journal', saved: 'Saved',
          hello: 'Your next story starts here.', intro: 'Discover activities, ideas and people who might inspire you to try something new.',
          discover: 'DISCOVER SOMETHING NEW', categories: 'Explore by category',
          categoryHint: 'Choose what interests you.', journalTitle: 'The Journal',
          journalDesc: 'Stories, experiences and the people behind new beginnings.', journalOpen: 'Open the Journal',
          exploreTitle: 'What would you like to try?', exploreDesc: 'Find inspiration across six MOVE&TRY categories.',
          diceTitle: 'Surprise Me', diceDesc: 'Let chance choose your next activity.',
          diceButton: 'ROLL THE DICE', diceBusy: 'ROLLING…', diceReady: 'Roll the dice to discover an activity.',
          diceUnavailable: 'No published activities are currently available for a random pick.',
          diceResult: 'Your suggestion:', diceOpen: 'View activity', diceAgain: 'Try again',
          whereTitle: 'Where to Try', whereDesc: 'Discover places and people who can help you take the first step.',
          whereOpen: 'Explore opportunities', savedTitle: 'Saved',
          savedDesc: 'Your saved activities and articles will appear here once saving is available.',
          settings: 'Settings', notifications: 'Notifications', noNotifications: 'No notifications yet.',
          languageLabel: 'App language', settingsNote: 'You can change your language at any time.',
          privacyLabel: 'Privacy', privacyButton: 'Privacy and cookies →',
          close: 'Close', pushUnsupported: 'Push notifications are not supported in this browser.',
          pushDenied: 'Notifications are blocked in your browser settings.',
          pushEnabled: 'Notifications are permitted on this device.',
          pushNotEnabled: 'Notifications are not enabled on this device yet.',
          pushExisting: 'A push subscription is active on this device.',
          pushManage: 'Manage notifications in your device settings.',
          pushCheck: 'Check notification status', pushChecking: 'Checking…',
          pushTurnOn: 'Enable notifications', pushTurnOff: 'Disable notifications', pushSave: 'Save categories',
          pushCategories: 'Choose notification categories', pushSaving: 'Saving…', pushSaved: 'Categories saved.',
          pushSelect: 'Choose at least one category.', pushError: 'Could not save. Check your connection and try again.',
          privacyUnavailable: 'Privacy settings are currently unavailable. Please try again after the page loads.',
          categoryMove: 'Get moving', categoryCreate: 'Get creative', categoryLearn: 'Learn something',
          categoryExplore: 'Explore', categoryDare: 'Challenge yourself', categoryCare: 'Take care',
          openCategory: 'Open category', access: 'Accessibility'
        }
      };

      const CATEGORY_DATA = [
        { id: 'move', title: 'MOVE', subtitle: 'categoryMove', image: '/images/move.jpg' },
        { id: 'create', title: 'CREATE', subtitle: 'categoryCreate', image: '/images/create.jpg' },
        { id: 'learn', title: 'LEARN', subtitle: 'categoryLearn', image: '/images/learn.jpg' },
        { id: 'explore', title: 'EXPLORE', subtitle: 'categoryExplore', image: '/images/explore.jpg' },
        { id: 'dare', title: 'DARE', subtitle: 'categoryDare', image: '/images/dare.jpg' },
        { id: 'care', title: 'CARE', subtitle: 'categoryCare', image: '/images/care.jpg' }
      ];

      const tabs = ['home', 'explore', 'where', 'journal', 'saved'];
      const view = document.getElementById('view');
      const welcome = document.getElementById('welcome');
      const notificationPanel = document.getElementById('notifications-panel');
      const settingsPanel = document.getElementById('settings-panel');
      let currentTab = 'home';
      let language = 'hr';
      let chosenLanguage = 'hr';
      let previouslyFocused = null;
      let activePanel = null;

      function translations() { return I18N[language]; }
      function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[character]);
      }
      function getStored(key) {
        try { return localStorage.getItem(key); } catch (_) { return null; }
      }
      function setStored(key, value) {
        try { localStorage.setItem(key, value); } catch (_) { /* Storage may be unavailable. */ }
      }
      function categoryCards() {
        const t = translations();
        return `<div class="categories">${CATEGORY_DATA.map(category => `
          <a class="category" href="${language === 'hr' ? '/hr/' : '/'}${category.id}.html"
             style="background-image:url('${category.image}')"
             aria-label="${escapeHTML(category.title + ' — ' + t[category.subtitle])}">
            <strong>${category.title}</strong><small>${escapeHTML(t[category.subtitle])}</small>
          </a>`).join('')}</div>`;
      }
      function journalLink() { return language === 'hr' ? '/hr/journal/' : '/journal/'; }
      function whereLink() { return language === 'hr' ? '/hr/where-to-try.html' : '/where-to-try.html'; }

      function renderHome() {
        const t = translations();
        return `<section class="intro"><div class="eyebrow">MOVE&TRY</div>
          <h1>${escapeHTML(t.hello)}</h1><p>${escapeHTML(t.intro)}</p></section>
          <div class="hero" role="img" aria-label="${escapeHTML(t.discover)}"><span>${escapeHTML(t.discover)}</span></div>
          <section class="section"><div class="eyebrow">MOVE · CREATE · LEARN · EXPLORE · DARE · CARE</div>
          <h2>${escapeHTML(t.categories)}</h2>${categoryCards()}</section>
          <section class="section journal-section"><div class="eyebrow">MOVE&TRY</div>
          <h2>${escapeHTML(t.journalTitle)}</h2><a class="feature" href="${journalLink()}">
          <span><strong>${escapeHTML(t.journalOpen)}</strong><small>${escapeHTML(t.journalDesc)}</small></span>
          <span aria-hidden="true">→</span></a></section>`;
      }
      function renderExplore() {
        const t = translations();
        return `<section class="placeholder"><div class="eyebrow">MOVE&TRY</div>
          <h1>${escapeHTML(t.exploreTitle)}</h1><p>${escapeHTML(t.exploreDesc)}</p>
          <div class="surprise-box"><div class="eyebrow">MOVE&TRY</div><h2>${escapeHTML(t.diceTitle)}</h2>
          <p>${escapeHTML(t.diceDesc)}</p><div class="dice-area">
          <div class="dice-stage"><div class="dice-cube" id="dice-cube">${diceFaces()}</div></div>
          <button class="surprise-button" id="surprise-pick" type="button" ${surpriseActivities.length ? '' : 'disabled'}>${escapeHTML(t.diceButton)}</button>
          <p class="dice-caption" id="dice-caption" role="status" aria-live="polite">${escapeHTML(surpriseActivities.length ? t.diceReady : t.diceUnavailable)}</p>
          </div><div class="surprise-result" id="surprise-result" hidden></div></div>
          <h2>${escapeHTML(t.categories)}</h2>${categoryCards()}</section>`;
      }
      function renderWhere() {
        const t = translations();
        return `<section class="placeholder"><div class="eyebrow">MOVE&TRY</div><h1>${escapeHTML(t.whereTitle)}</h1>
          <p>${escapeHTML(t.whereDesc)}</p><a class="text-link" href="${whereLink()}">${escapeHTML(t.whereOpen)} →</a></section>`;
      }
      function renderJournal() {
        const t = translations();
        return `<section class="placeholder"><div class="eyebrow">MOVE&TRY</div><h1>${escapeHTML(t.journalTitle)}</h1>
          <p>${escapeHTML(t.journalDesc)}</p><a class="text-link" href="${journalLink()}">${escapeHTML(t.journalOpen)} →</a></section>`;
      }
      function renderSaved() {
        const t = translations();
        return `<section class="placeholder"><div class="eyebrow">MOVE&TRY</div><h1>${escapeHTML(t.savedTitle)}</h1>
          <p>${escapeHTML(t.savedDesc)}</p></section>`;
      }
      function render() {
        const renderers = { home: renderHome, explore: renderExplore, where: renderWhere,
          journal: renderJournal, saved: renderSaved };
        view.innerHTML = renderers[currentTab]();
        document.querySelectorAll('[data-tab]').forEach(button => {
          if (button.dataset.tab === currentTab) button.setAttribute('aria-current', 'page');
          else button.removeAttribute('aria-current');
        });
        document.querySelectorAll('[data-nav]').forEach(node => {
          node.textContent = translations()[node.dataset.nav];
        });
      }
      function changeTab(tab, focusView = true) {
        if (!tabs.includes(tab)) return;
        currentTab = tab;
        render();
        window.scrollTo({ top: 0, behavior: 'instant' });
        if (focusView) view.focus({ preventScroll: true });
      }
      function setLanguage(next) {
        if (!I18N[next]) return;
        language = next;
        chosenLanguage = next;
        document.documentElement.lang = next;
        setStored(APP_LANGUAGE_KEY, next);
        setStored(WEB_LANGUAGE_KEY, next);
        document.querySelectorAll('[data-setting-language]').forEach(button => {
          button.setAttribute('aria-pressed', String(button.dataset.settingLanguage === next));
        });
        const t = translations();
        document.getElementById('notifications-title').textContent = t.notifications;
        document.getElementById('settings-title').textContent = t.settings;
        document.getElementById('notifications-empty').textContent = t.noNotifications;
        document.getElementById('language-label').textContent = t.languageLabel;
        document.getElementById('settings-note').textContent = t.settingsNote;
        document.getElementById('privacy-label').textContent = t.privacyLabel;
        document.getElementById('privacy-settings-button').textContent = t.privacyButton;
        document.getElementById('notifications-button').setAttribute('aria-label', t.notifications);
        document.getElementById('settings-button').setAttribute('aria-label', t.settings);
        document.querySelectorAll('[data-close-panel]').forEach(button => button.setAttribute('aria-label', t.close));
        render();
        refreshPushStatus();
      }
      function showPanel(panel) {
        closePanel();
        previouslyFocused = document.activeElement;
        activePanel = panel;
        panel.hidden = false;
        document.body.classList.add('dialog-open');
        panel.querySelector('.panel').focus();
        if (panel === notificationPanel) refreshPushStatus();
      }
      function closePanel() {
        if (!activePanel) return;
        activePanel.hidden = true;
        activePanel = null;
        document.body.classList.remove('dialog-open');
        if (previouslyFocused && previouslyFocused.isConnected) previouslyFocused.focus();
      }
      function trapDialogFocus(event) {
        if (!activePanel || event.key !== 'Tab') return;
        const elements = Array.from(activePanel.querySelectorAll('button:not([disabled]):not([hidden]),a[href],input:not([disabled])'))
          .filter(element => element.getClientRects().length);
        if (!elements.length) { event.preventDefault(); return; }
        const first = elements[0], last = elements[elements.length - 1];
        if (event.shiftKey && (document.activeElement === first || document.activeElement === activePanel.querySelector('.panel'))) {
          event.preventDefault(); last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault(); first.focus();
        }
      }
      const APP_PUSH_API = 'https://pdyngeaykfpybeafjtpw.supabase.co/functions/v1/';
      const PUSH_TOKEN_KEY = 'moveandtry_app_push_device_token';
      const PUSH_CATEGORY_KEY = 'moveandtry_app_push_categories';
      const PUSH_CATEGORIES = ['MOVE', 'CREATE', 'LEARN', 'EXPLORE', 'DARE', 'CARE'];
      let pushBusy = false;

      function pushSupported() {
        return window.isSecureContext && 'Notification' in window &&
          'serviceWorker' in navigator && 'PushManager' in window;
      }
      function pushToken() {
        let token = getStored(PUSH_TOKEN_KEY);
        if (!token || !/^[a-f0-9]{64}$/.test(token)) {
          const bytes = crypto.getRandomValues(new Uint8Array(32));
          token = Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
          setStored(PUSH_TOKEN_KEY, token);
        }
        return token;
      }
      function selectedPushCategories() {
        return Array.from(document.querySelectorAll('#push-category-grid input:checked'))
          .map(input => input.value);
      }
      function storedPushCategories() {
        try {
          const value = JSON.parse(getStored(PUSH_CATEGORY_KEY) || '[]');
          return Array.isArray(value) ? value.filter(x => PUSH_CATEGORIES.includes(x)) : [];
        } catch (_) { return []; }
      }
      function renderPushCategories() {
        const t = translations();
        const selected = storedPushCategories();
        document.getElementById('push-categories-title').textContent = t.pushCategories;
        document.getElementById('push-save').textContent = t.pushSave;
        document.getElementById('push-category-grid').innerHTML = PUSH_CATEGORIES.map(category =>
          `<label><input type="checkbox" value="${category}" ${selected.includes(category) ? 'checked' : ''}>${category}</label>`
        ).join('');
      }
      async function pushApi(name, options = {}) {
        const response = await fetch(APP_PUSH_API + name, {
          ...options,
          mode: 'cors',
          cache: 'no-store',
          headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'Push API error: ' + response.status);
        return result;
      }
      function urlBase64ToUint8Array(base64) {
        const padding = '='.repeat((4 - base64.length % 4) % 4);
        const binary = atob((base64 + padding).replace(/-/g, '+').replace(/_/g, '/'));
        return Uint8Array.from(binary, char => char.charCodeAt(0));
      }
      async function appPushRegistration() {
        return navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' });
      }
      async function refreshPushStatus() {
        const t = translations();
        const status = document.getElementById('push-status');
        const button = document.getElementById('push-toggle');
        const fieldset = document.getElementById('push-categories');
        if (!document.querySelector('#push-category-grid input')) renderPushCategories();
        else {
          document.getElementById('push-categories-title').textContent = t.pushCategories;
          document.getElementById('push-save').textContent = t.pushSave;
        }
        if (!pushSupported()) {
          status.textContent = t.pushUnsupported;
          button.hidden = true;
          fieldset.hidden = true;
          return;
        }
        if (Notification.permission === 'denied') {
          status.textContent = t.pushDenied;
          button.hidden = true;
          fieldset.hidden = true;
          return;
        }
        try {
          const registration = await appPushRegistration();
          const subscription = await registration.pushManager.getSubscription();
          const active = !!subscription;
          button.hidden = false;
          button.disabled = pushBusy;
          button.textContent = active ? t.pushTurnOff : t.pushTurnOn;
          fieldset.hidden = false;
          document.getElementById('push-save').hidden = !active;
          status.textContent = active ? t.pushExisting : t.pushNotEnabled;
        } catch (error) {
          console.warn('Push status:', error);
          status.textContent = t.pushError;
          button.hidden = true;
          fieldset.hidden = true;
        }
      }
      async function togglePush() {
        if (pushBusy || !pushSupported()) return;
        const t = translations();
        const status = document.getElementById('push-status');
        const button = document.getElementById('push-toggle');
        pushBusy = true;
        button.disabled = true;
        status.textContent = t.pushChecking;
        try {
          const registration = await appPushRegistration();
          let subscription = await registration.pushManager.getSubscription();
          if (subscription) {
            // Remove server registration before unsubscribing locally.
            await pushApi('app-push-subscribe', {
              method: 'POST',
              body: JSON.stringify({ action: 'unsubscribe', deviceToken: pushToken(), subscription: subscription.toJSON() })
            });
            const removed = await subscription.unsubscribe();
            if (!removed) throw new Error('Browser unsubscribe failed');
          } else {
            const permission = await Notification.requestPermission();
            if (permission !== 'granted') { await refreshPushStatus(); return; }
            const config = await pushApi('app-push-config');
            if (!/^[A-Za-z0-9_-]{87}$/.test(config.publicKey || '')) throw new Error('Invalid VAPID key');
            const categories = selectedPushCategories().length ? selectedPushCategories() : storedPushCategories();
            if (!categories.length) { status.textContent = t.pushSelect; return; }
            subscription = await registration.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(config.publicKey)
            });
            try {
              await pushApi('app-push-subscribe', {
                method: 'POST',
                body: JSON.stringify({ action: 'subscribe', deviceToken: pushToken(), subscription: subscription.toJSON(), categories })
              });
            } catch (error) {
              await subscription.unsubscribe();
              throw error;
            }
            setStored(PUSH_CATEGORY_KEY, JSON.stringify(categories));
          }
        } catch (error) {
          console.error('Push toggle:', error);
          status.textContent = t.pushError;
        } finally {
          pushBusy = false;
          await refreshPushStatus();
        }
      }
      async function savePushCategories() {
        if (pushBusy) return;
        const t = translations();
        const categories = selectedPushCategories();
        const status = document.getElementById('push-status');
        if (!categories.length) { status.textContent = t.pushSelect; return; }
        pushBusy = true;
        document.getElementById('push-save').disabled = true;
        status.textContent = t.pushSaving;
        try {
          const registration = await appPushRegistration();
          const subscription = await registration.pushManager.getSubscription();
          if (!subscription) throw new Error('No active subscription');
          await pushApi('app-push-subscribe', {
            method: 'POST',
            body: JSON.stringify({ action: 'subscribe', deviceToken: pushToken(), subscription: subscription.toJSON(), categories })
          });
          setStored(PUSH_CATEGORY_KEY, JSON.stringify(categories));
          status.textContent = t.pushSaved;
        } catch (error) {
          console.error('Push categories:', error);
          status.textContent = t.pushError;
        } finally {
          pushBusy = false;
          document.getElementById('push-save').disabled = false;
        }
      }
      async function rollDice() {
        if (diceBusy || !surpriseActivities.length) return;
        const t = translations();
        const button = document.getElementById('surprise-pick');
        const cube = document.getElementById('dice-cube');
        const caption = document.getElementById('dice-caption');
        const result = document.getElementById('surprise-result');
        const candidates = surpriseActivities.filter(item => item.id !== lastSurpriseId);
        const pool = candidates.length ? candidates : surpriseActivities;
        const selected = pool[Math.floor(Math.random() * pool.length)];
        lastSurpriseId = selected.id;
        diceBusy = true;
        button.disabled = true;
        button.textContent = t.diceBusy;
        result.hidden = true;
        caption.textContent = t.diceBusy;
        diceTurns += 1;
        cube.style.transform = `rotateX(${diceTurns * 720 + 340}deg) rotateY(${diceTurns * 720 + 405}deg)`;
        await new Promise(resolve => setTimeout(resolve, reducedMotion.matches ? 0 : 1400));
        if (currentTab !== 'explore') { diceBusy = false; return; }
        result.innerHTML = `<strong>${escapeHTML(t.diceResult)} ${escapeHTML(selected.name[language])}</strong>
          <div class="surprise-actions"><a class="text-link" href="${escapeHTML(selected.url[language])}">${escapeHTML(t.diceOpen)} →</a>
          <button class="surprise-button" type="button" id="dice-again">${escapeHTML(t.diceAgain)}</button></div>`;
        result.hidden = false;
        caption.textContent = t.diceReady;
        button.textContent = t.diceButton;
        button.disabled = false;
        diceBusy = false;
      }
      function openPrivacySettings() {
        const trigger = document.getElementById('privacy-settings-button');
        closePanel();
        if (window.MoveTryConsent && typeof window.MoveTryConsent.openSettings === 'function') {
          window.MoveTryConsent.openSettings(trigger);
        } else {
          alert(translations().privacyUnavailable);
        }
      }

      document.querySelectorAll('[data-tab]').forEach(button => {
        button.addEventListener('click', () => changeTab(button.dataset.tab));
      });
      view.addEventListener('click', event => {
        if (event.target.closest('#surprise-pick, #dice-again')) rollDice();
      });
      document.getElementById('notifications-button').addEventListener('click', () => showPanel(notificationPanel));
      document.getElementById('settings-button').addEventListener('click', () => showPanel(settingsPanel));
      document.querySelectorAll('[data-close-panel]').forEach(button => button.addEventListener('click', closePanel));
      [notificationPanel, settingsPanel].forEach(panel => panel.addEventListener('click', event => {
        if (event.target === panel) closePanel();
      }));
      document.addEventListener('keydown', event => {
        if (event.key === 'Escape') closePanel();
        trapDialogFocus(event);
      });
      document.querySelectorAll('[data-setting-language]').forEach(button => {
        button.addEventListener('click', () => setLanguage(button.dataset.settingLanguage));
      });
      document.getElementById('privacy-settings-button').addEventListener('click', openPrivacySettings);
      document.getElementById('push-toggle').addEventListener('click', togglePush);
      document.getElementById('push-save').addEventListener('click', savePushCategories);
      document.querySelectorAll('[data-choice]').forEach(button => button.addEventListener('click', () => {
        chosenLanguage = button.dataset.choice;
        document.querySelectorAll('[data-choice]').forEach(item => {
          item.setAttribute('aria-pressed', String(item.dataset.choice === chosenLanguage));
        });
      }));
      document.getElementById('continue').addEventListener('click', () => {
        setLanguage(chosenLanguage);
        welcome.hidden = true;
        setStored(SESSION_KEY, '1');
        document.querySelector('[data-tab="home"]').focus();
      });
      const savedLanguage = getStored(APP_LANGUAGE_KEY) || getStored(WEB_LANGUAGE_KEY);
      setLanguage(I18N[savedLanguage] ? savedLanguage : 'hr');
      if (!I18N[savedLanguage]) {
        welcome.hidden = false;
        document.querySelector('[data-choice="hr"]').focus();
      }
      loadSurpriseActivities();
    })();
  </script>
  <script src="/consent.js" defer></script>
</body>
</html>
