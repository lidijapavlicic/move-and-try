
<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f2">
<meta name="description" content="MOVE&TRY — Discover something new to try.">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/app/manifest.webmanifest">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>MOVE&TRY — App</title>

<style>
:root {
  --bg: #f7f6f2;
  --ink: #171916;
  --muted: #697067;
  --green: #1f2a18;
  --line: #dcded6;
  --white: #fff;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: Manrope, sans-serif;
}

button, a { font: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

button:focus-visible,
a:focus-visible {
  outline: 3px solid #758b6b;
  outline-offset: 3px;
}

[hidden] { display: none !important; }

.shell {
  max-width: 720px;
  margin: auto;
  min-height: 100dvh;
  padding-bottom: calc(90px + env(safe-area-inset-bottom));
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 24px 22px 18px;
}

.brand {
  font-weight: 800;
  letter-spacing: .1em;
  font-size: 18px;
}

.language {
  border: 1px solid var(--line);
  background: #fff;
  padding: 8px 12px;
  font-size: 11px;
  font-weight: 800;
}

.eyebrow {
  font-size: 10px;
  letter-spacing: .18em;
  font-weight: 800;
  color: #687b61;
  text-transform: uppercase;
}

.intro { padding: 30px 22px 18px; }

.intro h1 {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(40px, 10vw, 62px);
  font-weight: 400;
  line-height: 1.05;
  margin: 14px 0;
}

.intro p {
  font-size: 14px;
  line-height: 1.8;
  color: var(--muted);
  max-width: 440px;
}

.hero {
  margin: 12px 22px 28px;
  min-height: 230px;
  position: relative;
  overflow: hidden;
  background: #243227 url('/images/home-discover.png') center/cover no-repeat;
}

.hero:after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 30%, rgba(0,0,0,.55));
}

.hero span {
  position: absolute;
  z-index: 1;
  left: 20px;
  bottom: 18px;
  color: white;
  font-size: 11px;
  letter-spacing: .14em;
  font-weight: 800;
}

.section { padding: 14px 22px 26px; }

.section h2 {
  font-family: 'DM Serif Display', serif;
  font-weight: 400;
  font-size: 31px;
  margin: 8px 0 18px;
}

.categories {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 12px;
}

.category {
  min-height: 140px;
  padding: 17px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  background-color: #243227;
  background-position: center;
  background-size: cover;
  position: relative;
  isolation: isolate;
  color: #fff;
  overflow: hidden;
}

.category:before {
  content: '';
  position: absolute;
  z-index: -1;
  inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,.05), rgba(0,0,0,.72));
}

.category strong {
  font-size: 17px;
  letter-spacing: .05em;
}

.category small {
  font-size: 10px;
  opacity: .88;
  margin-top: 7px;
}

.feature {
  border-top: 1px solid var(--line);
  padding: 22px 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.feature strong {
  display: block;
  font-size: 13px;
}

.feature small {
  display: block;
  color: var(--muted);
  font-size: 11px;
  margin-top: 5px;
}

.feature span:last-child { font-size: 20px; }

.bottom {
  position: fixed;
  z-index: 5;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(247,246,242,.97);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-around;
  padding: 11px max(12px,env(safe-area-inset-right))
           calc(11px + env(safe-area-inset-bottom))
           max(12px,env(safe-area-inset-left));
  backdrop-filter: blur(10px);
}

.bottom button {
  border: 0;
  background: none;
  color: var(--muted);
  min-width: 62px;
  display: grid;
  gap: 4px;
  justify-items: center;
  font-size: 10px;
  font-weight: 700;
}

.bottom button[aria-current="page"] { color: var(--green); }

.bottom svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.placeholder { padding: 40px 22px; }

.placeholder h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 44px;
  font-weight: 400;
}

.placeholder p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
}

.text-link {
  display: inline-block;
  border-bottom: 1px solid var(--ink);
  font-size: 12px;
  font-weight: 800;
  padding: 7px 0;
}

.overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  background: var(--bg);
  display: grid;
  place-items: center;
  padding: 26px;
}

.welcome {
  max-width: 390px;
  width: 100%;
  text-align: center;
}

.welcome .brand { font-size: 26px; }

.welcome h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 39px;
  font-weight: 400;
  margin: 42px 0 10px;
}

.welcome p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.7;
}

.choices {
  display: grid;
  gap: 12px;
  margin: 30px 0 22px;
}

.choice {
  background: white;
  border: 1px solid var(--line);
  padding: 18px;
  text-align: left;
  font-size: 14px;
  font-weight: 700;
}

.choice[aria-pressed="true"] {
  border: 2px solid var(--green);
  padding: 17px;
}

.primary {
  border: 0;
  background: var(--green);
  color: white;
  padding: 17px;
  width: 100%;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .08em;
}

.hint {
  font-size: 11px !important;
  margin-top: 18px;
}

/* In-app website viewer */

body.viewer-open {
  overflow: hidden;
}

.viewer {
  position: fixed;
  inset: 0 0 calc(68px + env(safe-area-inset-bottom)) 0;
  z-index: 4;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

.viewer-toolbar {
  flex: 0 0 auto;
  min-height: 55px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 14px;
  border-bottom: 1px solid var(--line);
  background: var(--bg);
}

.viewer-button {
  border: 1px solid var(--line);
  background: #fff;
  padding: 10px 12px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

.viewer-title {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 800;
  text-align: center;
}

.viewer-frame {
  display: block;
  flex: 1;
  width: 100%;
  min-height: 0;
  border: 0;
  background: #fff;
}

.viewer-message {
  padding: 14px 20px;
  font-size: 12px;
  line-height: 1.6;
  color: var(--muted);
  background: #fff;
  border-bottom: 1px solid var(--line);
}

@media (min-width: 720px) {
  .bottom {
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: 720px;
  }

  .hero { min-height: 310px; }
  .category { min-height: 190px; }

  .viewer {
    left: 50%;
    right: auto;
    transform: translateX(-50%);
    width: 720px;
  }
}
</style>
</head>

<body>

<div class="overlay" id="welcome" hidden>
  <div class="welcome">
    <div class="brand">MOVE&TRY</div>
    <h1>Choose your language.</h1>
    <p>Odaberi jezik / Select your language</p>

    <div class="choices">
      <button class="choice" type="button"
        data-choice="hr" aria-pressed="true">
        🇭🇷 Hrvatski
      </button>
      <button class="choice" type="button"
        data-choice="en" aria-pressed="false">
        🇬🇧 English
      </button>
    </div>

    <button class="primary" id="continue" type="button">
      NASTAVI →
    </button>

    <p class="hint">
      Jezik možeš promijeniti kasnije. /
      You can change it later.
    </p>
  </div>
</div>

<div class="shell">
  <header class="top">
    <a class="brand" href="/app/" aria-label="MOVE&TRY home">
      MOVE&TRY
    </a>
    <button class="language" id="language-toggle"
      type="button" aria-label="Change language">
      HR / EN
    </button>
  </header>

  <main id="view" tabindex="-1"></main>
</div>

<section class="viewer" id="viewer" hidden
  aria-label="MOVE&TRY website content">

  <div class="viewer-toolbar">
    <button class="viewer-button" id="viewer-back" type="button">
      ← Natrag
    </button>

    <span class="viewer-title" id="viewer-title">
      MOVE&TRY
    </span>

    <button class="viewer-button" id="viewer-home" type="button">
      Početna
    </button>
  </div>

  <div class="viewer-message" id="viewer-message" hidden></div>

  <iframe
    class="viewer-frame"
    id="viewer-frame"
    title="MOVE&TRY content"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
</section>

<nav class="bottom" aria-label="App navigation">
  <button type="button" data-tab="home" aria-current="page">
    <svg viewBox="0 0 24 24">
      <path d="m3 10 9-7 9 7v10H3z"/>
      <path d="M9 20v-7h6v7"/>
    </svg>
    <span data-nav="home">Početna</span>
  </button>

  <button type="button" data-tab="explore">
    <svg viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="m16 16 5 5"/>
    </svg>
    <span data-nav="explore">Istraži</span>
  </button>

  <button type="button" data-tab="journal">
    <svg viewBox="0 0 24 24">
      <path d="M4 4h12a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3z"/>
      <path d="M8 9h7M8 13h7"/>
    </svg>
    <span data-nav="journal">Journal</span>
  </button>

  <button type="button" data-tab="saved">
    <svg viewBox="0 0 24 24">
      <path d="M6 3h12v18l-6-4-6 4z"/>
    </svg>
    <span data-nav="saved">Spremljeno</span>
  </button>
</nav>

<script>
(() => {
  'use strict';

  const KEY = 'moveandtry_app_language';

  const CATEGORIES = [
    ['move', 'MOVE', 'category-move.webp'],
    ['learn', 'LEARN', 'category-learn.webp'],
    ['create', 'CREATE', 'category-create.webp'],
    ['explore', 'EXPLORE', 'category-explore.webp'],
    ['dare', 'DARE', 'category-dare.webp'],
    ['care', 'CARE', 'category-care.webp']
  ];

  const T = {
    hr: {
      intro: 'Tvoja sljedeća priča počinje znatiželjom.',
      sub: 'Istraži aktivnosti, pročitaj stvarna iskustva i pronađi nešto novo što želiš isprobati.',
      discover: 'OTKRIJ NEŠTO NOVO',
      categories: 'Što ti se danas radi?',
      explore: 'Istraži',
      home: 'Početna',
      journal: 'Journal',
      saved: 'Spremljeno',
      latest: 'ZA INSPIRACIJU',
      journalText: 'Priče, ideje i iskustva.',
      journalLink: 'Otvori The Journal',
      savedText: 'Ovdje će se nalaziti tvoji spremljeni sadržaji. Funkcionalnost dodajemo u sljedećoj fazi.',
      exploreText: 'Odaberi kategoriju i istraži aktivnosti na MOVE&TRY webu.',
      change: 'Promijeni jezik',
      continue: 'NASTAVI →',
      back: '← Natrag',
      loading: 'Otvaranje sadržaja…',
      blocked: 'Ako se sadržaj ne prikazuje, moguće je da web-poslužitelj blokira ugrađeni prikaz.'
    },
    en: {
      intro: 'Your next story starts with curiosity.',
      sub: 'Explore activities, read real experiences and find something new you want to try.',
      discover: 'DISCOVER SOMETHING NEW',
      categories: 'What do you feel like doing today?',
      explore: 'Explore',
      home: 'Home',
      journal: 'Journal',
      saved: 'Saved',
      latest: 'FOR INSPIRATION',
      journalText: 'Stories, ideas and experiences.',
      journalLink: 'Open The Journal',
      savedText: 'Your saved content will appear here. This feature is coming in a later phase.',
      exploreText: 'Choose a category and discover activities on the MOVE&TRY website.',
      change: 'Change language',
      continue: 'CONTINUE →',
      back: '← Back',
      loading: 'Opening content…',
      blocked: 'If content does not appear, the web server may be blocking embedded pages.'
    }
  };

  let lang = localStorage.getItem(KEY);
  if (lang !== 'hr' && lang !== 'en') lang = null;

  let selected = lang || 'hr';
  let tab = 'home';
  let viewerActive = false;
  let viewerInitialUrl = null;
  let viewerHasNavigated = false;

  const view = document.getElementById('view');
  const welcome = document.getElementById('welcome');
  const viewer = document.getElementById('viewer');
  const frame = document.getElementById('viewer-frame');
  const viewerTitle = document.getElementById('viewer-title');
  const viewerMessage = document.getElementById('viewer-message');
  const viewerBack = document.getElementById('viewer-back');
  const viewerHome = document.getElementById('viewer-home');

  function currentLanguage() {
    return lang || selected;
  }

  function translations() {
    return T[currentLanguage()];
  }

  function prefix() {
    return currentLanguage() === 'hr' ? '/hr/' : '/';
  }

  function validInternalUrl(value) {
    try {
      const url = new URL(value, window.location.origin);

      if (url.origin !== window.location.origin) return null;

      // The Editor is a separate application.
      if (url.pathname.startsWith('/editor/')) return null;

      // Do not embed the app inside itself.
      if (url.pathname.startsWith('/app/')) return null;

      return url;
    } catch {
      return null;
    }
  }

  function syncLanguage() {
    // Keep the website's existing language preference aligned.
    localStorage.setItem('moveandtry_language', currentLanguage());
  }

  function updateViewerLabels() {
    const t = translations();
    viewerBack.textContent = t.back;
    viewerHome.textContent = t.home;
  }

  function openContent(path) {
    const url = validInternalUrl(path);

    if (!url) return;

    syncLanguage();
    updateViewerLabels();

    viewerInitialUrl = url.href;
    viewerHasNavigated = false;
    viewerActive = true;

    viewer.hidden = false;
    document.body.classList.add('viewer-open');

    viewerTitle.textContent = 'MOVE&TRY';
    viewerMessage.textContent = translations().loading;
    viewerMessage.hidden = false;

    frame.src = url.href;
  }

  function closeContent() {
    viewerActive = false;
    viewer.hidden = true;
    document.body.classList.remove('viewer-open');

    frame.removeAttribute('src');
    viewerMessage.hidden = true;
    viewerInitialUrl = null;
    viewerHasNavigated = false;
  }

  function goBackInContent() {
    if (!viewerActive) return;

    if (!viewerHasNavigated) {
      closeContent();
      return;
    }

    try {
      frame.contentWindow.history.back();
    } catch {
      closeContent();
    }
  }

  function handleFrameLoad() {
    if (!viewerActive) return;

    viewerMessage.hidden = true;

    try {
      const doc = frame.contentDocument;
      const location = frame.contentWindow.location;

      if (!doc || !location) {
        viewerMessage.textContent = translations().blocked;
        viewerMessage.hidden = false;
        return;
      }

      if (location.origin !== window.location.origin) {
        viewerMessage.textContent = translations().blocked;
        viewerMessage.hidden = false;
        return;
      }

      viewerTitle.textContent =
        (doc.title || 'MOVE&TRY').replace(/\s*[|—-]\s*MOVE\s*&\s*TRY.*$/i, '');

      viewerHasNavigated =
        location.href !== viewerInitialUrl;

      // Same-origin links remain inside the embedded viewer.
      // External links keep their normal browser behavior.
      doc.addEventListener('click', event => {
        const link = event.target.closest?.('a[href]');
        if (!link || event.defaultPrevented) return;

        const href = link.getAttribute('href');

        if (!href ||
            href.startsWith('#') ||
            href.startsWith('mailto:') ||
            href.startsWith('tel:') ||
            link.hasAttribute('download')) {
          return;
        }

        const url = validInternalUrl(link.href);

        if (!url) return;

        if (link.target === '_blank') {
          event.preventDefault();
          frame.contentWindow.location.assign(url.href);
        }
      }, true);

      // Forms and scripts on the original page remain untouched.
    } catch (error) {
      console.warn('MOVE&TRY embedded content:', error);
      viewerMessage.textContent = translations().blocked;
      viewerMessage.hidden = false;
    }
  }

  function render() {
    const t = translations();

    document.documentElement.lang = currentLanguage();
    document.title = 'MOVE&TRY — ' + t.home;

    document.querySelectorAll('[data-nav]').forEach(node => {
      node.textContent = t[node.dataset.nav];
    });

    document.querySelectorAll('[data-tab]').forEach(button => {
      button.setAttribute(
        'aria-current',
        button.dataset.tab === tab ? 'page' : 'false'
      );
    });

    updateViewerLabels();

    const cards = CATEGORIES.map(([slug, name, img]) => `
      <a class="category"
         href="${prefix()}${slug}.html"
         style="background-image:url('/images/${img}')">
        <strong>${name}</strong>
        <small>${t.explore} →</small>
      </a>
    `).join('');

    if (tab === 'home') {
      view.innerHTML = `
        <section class="intro">
          <div class="eyebrow">MOVE&TRY · ${t.discover}</div>
          <h1>${t.intro}</h1>
          <p>${t.sub}</p>
        </section>

        <div class="hero">
          <span>YOU DON'T HAVE TO BE GOOD AT IT. JUST TRY.</span>
        </div>

        <section class="section">
          <div class="eyebrow">${t.discover}</div>
          <h2>${t.categories}</h2>
          <div class="categories">${cards}</div>
        </section>

        <section class="section">
          <div class="eyebrow">${t.latest}</div>
          <h2>The Journal</h2>
          <a class="feature" href="${prefix()}journal.html">
            <span>
              <strong>${t.journalText}</strong>
              <small>${t.journalLink}</small>
            </span>
            <span>→</span>
          </a>
        </section>
      `;
    } else if (tab === 'explore') {
      view.innerHTML = `
        <section class="placeholder">
          <div class="eyebrow">MOVE&TRY</div>
          <h1>${t.explore}</h1>
          <p>${t.exploreText}</p>
          <div class="categories">${cards}</div>
        </section>
      `;
    } else if (tab === 'journal') {
      view.innerHTML = `
        <section class="placeholder">
          <div class="eyebrow">THE JOURNAL</div>
          <h1>The Journal</h1>
          <p>${t.journalText}</p>
          <a class="text-link" href="${prefix()}journal.html">
            ${t.journalLink} →
          </a>
        </section>
      `;
    } else {
      view.innerHTML = `
        <section class="placeholder">
          <div class="eyebrow">MOVE&TRY</div>
          <h1>${t.saved}</h1>
          <p>${t.savedText}</p>
        </section>
      `;
    }
  }

  function showChoice() {
    selected = lang || selected;
    welcome.hidden = false;

    document.querySelectorAll('[data-choice]').forEach(button => {
      button.setAttribute(
        'aria-pressed',
        String(button.dataset.choice === selected)
      );
    });

    document.getElementById('continue').textContent =
      T[selected].continue;
  }

  document.querySelectorAll('[data-choice]').forEach(button => {
    button.addEventListener('click', () => {
      selected = button.dataset.choice;

      document.querySelectorAll('[data-choice]').forEach(choice => {
        choice.setAttribute(
          'aria-pressed',
          String(choice.dataset.choice === selected)
        );
      });

      document.getElementById('continue').textContent =
        T[selected].continue;
    });
  });

  document.getElementById('continue').addEventListener('click', () => {
    const changed = lang !== selected;

    lang = selected;
    localStorage.setItem(KEY, lang);
    syncLanguage();

    welcome.hidden = true;

    if (changed && viewerActive) closeContent();

    render();
  });

  document.getElementById('language-toggle')
    .addEventListener('click', showChoice);

  document.querySelectorAll('[data-tab]').forEach(button => {
    button.addEventListener('click', () => {
      closeContent();
      tab = button.dataset.tab;
      render();
      window.scrollTo(0, 0);
    });
  });

  // Intercept links on the app's own views.
  view.addEventListener('click', event => {
    const link = event.target.closest('a[href]');
    if (!link || event.defaultPrevented) return;

    const url = validInternalUrl(link.href);

    if (!url) return;

    event.preventDefault();
    openContent(url.href);
  });

  frame.addEventListener('load', handleFrameLoad);

  viewerBack.addEventListener('click', goBackInContent);

  viewerHome.addEventListener('click', () => {
    closeContent();
    tab = 'home';
    render();
    window.scrollTo(0, 0);
  });

  if (!lang) {
    showChoice();
  } else {
    syncLanguage();
  }

  render();

  if ('serviceWorker' in navigator && window.isSecureContext) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/app/sw.js', {
        scope: '/app/'
      }).catch(error => {
        console.warn('MOVE&TRY app service worker:', error);
      });
    });
  }
})();
</script>

</body>
</html>
