    <script>
        (function () {
            const LANGUAGE_KEY = "moveandtry_language";
            let savedLanguage = null;

            try {
                savedLanguage = localStorage.getItem(LANGUAGE_KEY);
            } catch (error) {
                console.warn("Language preference unavailable:", error);
            }

            const browserLanguage = navigator.language || "en";
            const preferredLanguage =
                savedLanguage === "hr" || savedLanguage === "en"
                    ? savedLanguage
                    : browserLanguage.toLowerCase().startsWith("hr") ? "hr" : "en";

            if (preferredLanguage === "hr" &&
                (window.location.pathname === "/" || window.location.pathname === "/index.html")) {
                window.location.replace("/hr/" + window.location.search + window.location.hash);
            }
        })();
    </script>
