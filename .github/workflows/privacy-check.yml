name: MOVE&TRY privacy check
on:
  push:
    branches: [main, gdpr-review]
  pull_request:
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check analytics and consent across public HTML
        run: python tools/check-privacy.py
